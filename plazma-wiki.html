<style>
  .content{max-width:1180px;margin:0 auto;padding:22px var(--gut) 80px}
  .wiki-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .wiki-head h1{font-size:1.7rem;font-family:var(--font-display)}
  .wiki-head .pver{font-family:var(--font-mono);font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);padding:3px 8px;border-radius:6px}
  .wiki-sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .wiki-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .wiki-search{flex:1;min-width:220px}
  .wiki-filters{display:flex;gap:6px;flex-wrap:wrap}
  .wf{font-size:12px;font-weight:600;padding:6px 11px;border-radius:20px;border:1px solid var(--border);
    background:var(--surface-2);color:var(--muted);cursor:pointer}
  .wf.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

  .wiki-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
  .wtile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;cursor:pointer;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r);transition:transform .12s,border-color .12s}
  .wtile:hover{transform:translateY(-3px);border-color:var(--accent-line)}
  .wtile img{width:52px;height:52px;border-radius:12px;display:block}
  .wtile .nm{font-size:11.5px;font-weight:600;text-align:center;line-height:1.2}
  .wtile .rl{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .wiki-empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;padding:40px}

  /* Détail */
  .wdetail{display:none}
  .wback{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent);
    background:none;border:0;cursor:pointer;margin-bottom:14px;padding:0}
  .wd-hero{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border);margin-bottom:18px;min-height:150px;
    background:var(--surface-2);display:flex;align-items:flex-end}
  .wd-hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 22%;opacity:.5}
  .wd-hero .grad{position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0%,transparent 70%)}
  .wd-hero .inner{position:relative;display:flex;align-items:flex-end;gap:14px;padding:18px 20px}
  .wd-hero img.ico{width:64px;height:64px;border-radius:14px;border:1px solid var(--border-2);flex-shrink:0}
  .wd-name{font-family:var(--font-display);font-size:1.8rem;font-weight:700;line-height:1.1}
  .wd-title{font-size:13px;color:var(--dim);text-transform:capitalize}
  .wd-tags{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  .wd-tag{font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}
  .wd-tag.res{background:var(--surface);color:var(--muted);border:1px solid var(--border)}

  .wd-sec-t{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--text);margin:20px 0 10px;
    padding-bottom:8px;border-bottom:1px solid var(--border)}
  .spell{display:flex;gap:13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:9px}
  .spell-ico{position:relative;flex-shrink:0}
  .spell-ico img{width:46px;height:46px;border-radius:10px;display:block}
  .spell-key{position:absolute;bottom:-5px;right:-5px;width:20px;height:20px;border-radius:6px;background:var(--accent);color:#04222a;
    font-family:var(--font-display);font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center}
  .spell-body{flex:1;min-width:0}
  .spell-name{font-weight:700;font-size:14px;margin-bottom:3px}
  .spell-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-bottom:7px}
  .spell-meta b{color:var(--dim);font-weight:700}
  .spell-desc{font-size:12.5px;color:var(--dim);line-height:1.6}
  .spell-desc br{content:'';display:block;margin:3px 0}
  /* Balises Data Dragon (rendues en éléments inline) — coloration par type */
  .spell-desc magicDamage,.spell-desc scaleAP,.spell-desc scaleMana{color:#5cc8ff;font-weight:600}
  .spell-desc physicalDamage,.spell-desc scaleAD{color:#f9a03c;font-weight:600}
  .spell-desc trueDamage{color:#f0f0f0;font-weight:600}
  .spell-desc healing,.spell-desc lifeSteal,.spell-desc scaleHealth{color:#5fd38a;font-weight:600}
  .spell-desc shield{color:#c3ccdb;font-weight:600}
  .spell-desc status,.spell-desc keywordMajor,.spell-desc keywordStealth,.spell-desc attention,.spell-desc recast{color:var(--accent);font-weight:600}
  .spell-desc speed{color:#8b9dff;font-weight:600}
  .spell-desc rules,.spell-desc flavorText{display:block;margin-top:6px;font-style:italic;color:var(--muted);font-size:11.5px}
  /* Chiffres précis par rang (source Meraki Analytics) */
  .lvtable{margin-top:9px;border-top:1px dashed var(--border);padding-top:8px;display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12px;font-family:var(--font-mono);align-items:baseline}
  .lv{display:contents}
  .lv-a{color:var(--muted);white-space:nowrap}
  .lv-v{color:#e6ebf2;font-weight:600}
  .mk-note{font-size:11px;color:var(--muted);margin:-4px 0 10px}

  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 13px}
  .stat .k{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-family:var(--font-display);font-size:1.15rem;font-weight:700;margin-top:2px}
  .stat .pl{font-size:10.5px;color:var(--muted);font-family:var(--font-mono)}

  .tips{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tipbox{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:13px 15px}
  .tipbox .t{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
  .tipbox ul{margin:0;padding-left:16px}
  .tipbox li{font-size:12px;color:var(--dim);line-height:1.5;margin-bottom:4px}

  @media(max-width:640px){.tips{grid-template-columns:1fr}}
</style>

<script src="assets/plazma.js?v=20260821f"></script>
<script>
'use strict';
PZ.mountNav('wiki', '#nav');

const DD='https://ddragon.leagueoflegends.com', LANG='fr_FR';
// Icônes hébergées dans le repo (rafraîchies chaque jour par une GitHub Action).
const MANIFEST='assets/champions/manifest.json';
const localIcon=id=> new URL('assets/champions/'+id+'.png', document.baseURI).href;
let WIKI_LOCAL=false;   // true quand le manifeste local est disponible
// Miroir indépendant (Community Dragon) : secours si Data Dragon est injoignable.
const CD_SUMMARY='https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-summary.json';
const CD_ICON=key=> key?`https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-icons/${key}.png`:'';
const KEY_BY_ID={};   // id de champion (alias) -> clé numérique, pour le miroir
const TAG_FR={Fighter:'Combattant',Mage:'Mage',Assassin:'Assassin',Marksman:'Tireur',Support:'Support',Tank:'Tank'};
const STAT_LABELS=[
  ['hp','PV','hpperlevel'],['mp','Ressource','mpperlevel'],['hpregen','Régén. PV','hpregenperlevel'],
  ['armor','Armure','armorperlevel'],['spellblock','Résist. magique','spellblockperlevel'],
  ['attackdamage','Dégâts (AD)','attackdamageperlevel'],['attackspeed','Vit. attaque','attackspeedperlevel'],
  ['movespeed','Vitesse','' ],['attackrange','Portée','']
];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Data Dragon renvoie du HTML sûr (Riot) ; on retire seulement d'éventuels <script>.
const safeHtml=s=>String(s||'').replace(/<script[\s\S]*?<\/script>/gi,'');

// Le tooltip contient les vrais chiffres, mais avec des placeholders :
//  {{ eN }} = valeurs de base par rang (effectBurn) ; {{ aN/fN }} = ratios (vars).
function resolveTooltip(spell){
  const desc = spell.description || '';
  let t = spell.tooltip || '';
  if(!t) return desc;
  const eff = spell.effectBurn || [];
  t = t.replace(/\{\{\s*e(\d+)\s*\}\}/g, (m,n)=> (eff[+n]!=null && eff[+n]!=='') ? eff[+n] : m);
  const vars = {}; (spell.vars||[]).forEach(v=>{ vars[v.key]=v; });
  const asPct = x => (typeof x==='number' && x>0 && x<=3) ? Math.round(x*100)+'%' : x;
  t = t.replace(/\{\{\s*([a-z]\d+)\s*\}\}/gi, (m,key)=>{
    const v = vars[key]; if(!v) return m;
    return Array.isArray(v.coeff) ? v.coeff.map(asPct).join('/') : String(asPct(v.coeff));
  });
  // S'il reste des placeholders NON résolus (fréquent sur les patchs récents),
  // on préfère la description générique (lisible) plutôt qu'un texte à trous.
  if(/\{\{/.test(t)) return desc || t.replace(/\{\{[^}]*\}\}/g,'…');
  return t;
}

// ── Chiffres précis par rang : Meraki Analytics ──────────────────────────
// Data Dragon ne fournit plus les montants exacts sur les champions récents.
// Meraki publie les valeurs entièrement résolues (dégâts/soin/bouclier par rang).
// On enrichit la fiche de façon NON bloquante et tolérante : toute erreur
// (réseau, 404, format inattendu) laisse simplement l'affichage Data Dragon.
const MERAKI='https://cdn.merakianalytics.com/riot/lol/resources/latest/en/champions/';
const MK_ATTR={
  'Damage':'Dégâts','Magic Damage':'Dégâts magiques','Physical Damage':'Dégâts physiques',
  'True Damage':'Dégâts bruts','Bonus Damage':'Dégâts bonus','Total Damage':'Dégâts totaux',
  'Base Damage':'Dégâts de base','Minimum Damage':'Dégâts min.','Maximum Damage':'Dégâts max.',
  'Damage Per Second':'Dégâts/sec','Damage per Tick':'Dégâts/intervalle','AoE Damage':'Dégâts de zone',
  'Empowered Damage':'Dégâts améliorés','Critical Damage':'Dégâts critiques',
  'Heal':'Soin','Healing':'Soin','Heal Amount':'Soin','Shield':'Bouclier','Shield Strength':'Bouclier',
  'Health':'PV','Bonus Health':'PV bonus','Health Restored':'PV rendus',
  'Attack Damage':"Dégâts d'attaque",'Movement Speed':'Vitesse de dép.','Move Speed':'Vitesse',
  'Bonus Attack Speed':"Vit. d'attaque bonus",'Attack Speed':"Vit. d'attaque",
  'Slow':'Ralentissement','Slow Amount':'Ralentissement','Duration':'Durée',
  'Stun Duration':"Durée d'étourd.",'Root Duration':"Durée d'immob.",
  'Range':'Portée','Cooldown':'Récupération','Cost':'Coût','Number of Targets':'Cibles',
  'Energy Restored':'Énergie rendue','Mana Restored':'Mana rendu','Resource':'Ressource',
  'Armor':'Armure','Bonus Armor':'Armure bonus','Magic Resistance':'Résist. magique',
  'Magic Resist':'Résist. magique','Grievous Wounds':'Blessures graves'
};
function mkAttr(a){ return MK_ATTR[a] || a || ''; }
function mkUnit(u){
  if(!u) return '';
  return String(u)
    .replace(/% of ability power/gi,"% d'AP")
    .replace(/% of attack damage/gi,"% d'AD")
    .replace(/% bonus attack damage/gi,'% AD bonus')
    .replace(/% bonus ability power/gi,'% AP bonus')
    .replace(/% bonus AD/gi,'% AD bonus')
    .replace(/% bonus AP/gi,'% AP bonus')
    .replace(/% (?:of )?target's maximum health/gi,'% PV max cible')
    .replace(/% (?:of )?maximum health/gi,'% PV max')
    .replace(/% (?:of )?max health/gi,'% PV max')
    .replace(/% (?:of )?missing health/gi,'% PV manquants')
    .replace(/% (?:of )?current health/gi,'% PV actuels')
    .replace(/bonus health/gi,'PV bonus')
    .replace(/maximum health/gi,'PV max')
    .replace(/max health/gi,'PV max')
    .replace(/ability power/gi,'AP')
    .replace(/attack damage/gi,'AD')
    .replace(/per second/gi,'/s')
    .replace(/\bseconds?\b/gi,'s');
}
function mkNum(n){ if(typeof n!=='number'||!isFinite(n)) return String(n); return String(Math.round(n*100)/100); }
function mkModifier(m){
  const vals=Array.isArray(m&&m.values)?m.values:[];
  const units=Array.isArray(m&&m.units)?m.units:[];
  if(!vals.length) return '';
  const allSame=vals.every(v=>v===vals[0]);
  const vstr=allSame?mkNum(vals[0]):vals.map(mkNum).join('/');
  const unit=mkUnit(units[0]||'');
  if(!unit) return vstr;
  return vstr + (unit[0]==='%'?unit:' '+unit);
}
function mkLeveling(arr){
  return (arr||[]).map(l=>{
    const attr=mkAttr(l&&l.attribute);
    const mods=((l&&l.modifiers)||[]).map(mkModifier).filter(Boolean);
    if(!attr || !mods.length) return '';
    const body=mods.map((s,i)=> i===0?s:'(+'+s+')').join(' ');
    return `<div class="lv"><span class="lv-a">${esc(attr)}</span><span class="lv-v">${esc(body)}</span></div>`;
  }).filter(Boolean).join('');
}
function mkBlock(ability){
  if(!ability) return '';
  let rows='';
  (ability.effects||[]).forEach(ef=>{ rows += mkLeveling(ef&&ef.leveling); });
  return rows ? `<div class="lvtable">${rows}</div>` : '';
}
// On ne garde en cache que le strict nécessaire (le JSON Meraki complet est lourd).
function mkSlim(d){
  const out={abilities:{}};
  ['P','Q','W','E','R'].forEach(k=>{
    const a=d&&d.abilities&&d.abilities[k]&&d.abilities[k][0];
    if(!a) return;
    out.abilities[k]=[{ effects:(a.effects||[]).map(ef=>({
      leveling:((ef&&ef.leveling)||[]).map(l=>({
        attribute:l.attribute,
        modifiers:((l&&l.modifiers)||[]).map(m=>({values:m.values,units:m.units}))
      }))
    })) }];
  });
  return out;
}
async function getMeraki(id){
  const key='pz_wiki_mk_'+id;
  try{ const c=JSON.parse(localStorage.getItem(key)||'null'); if(c&&c.t&&Date.now()-c.t<24*3600*1000) return c.d; }catch(e){}
  const slim=mkSlim(await fetchJSON(MERAKI+id+'.json'));
  try{ localStorage.setItem(key,JSON.stringify({t:Date.now(),d:slim})); }catch(e){}
  return slim;
}
async function enrichMeraki(id){
  let m; try{ m=await getMeraki(id); }catch(e){ return; }        // silencieux si indispo
  if(!m || !m.abilities) return;
  if((location.hash||'').replace(/^#/,'')!==id) return;          // l'utilisateur a changé de fiche
  const ab=m.abilities, added=[];
  document.querySelectorAll('#wdBody .spell[data-slot]').forEach(el=>{
    const slot=el.dataset.slot, a=ab[slot]&&ab[slot][0];
    if(!a) return;
    const bodyEl=el.querySelector('.spell-body');
    if(!bodyEl || bodyEl.querySelector('.lvtable')) return;
    const html=mkBlock(a);
    if(html){ bodyEl.insertAdjacentHTML('beforeend', html); added.push(slot); }
  });
  const head=document.querySelector('#wdBody .wd-sec-t');        // "Compétences"
  const after=head&&head.nextElementSibling;
  if(added.length && head && !(after&&after.classList.contains('mk-note'))){
    head.insertAdjacentHTML('afterend','<div class="mk-note">Chiffres précis par rang — source Meraki Analytics (libellés en anglais, parfois 1 patch de retard).</div>');
  }
}

let VER='', VER_ALT='', LIST=[], activeTag='';

// Secours d'image : Data Dragon publie parfois un patch avant que ses images ne
// soient sur le CDN → on réessaie avec le patch précédent, puis on masque.
function wImgAlt(img){
  if(!img) return;
  if(!img._alt && VER && VER_ALT && VER_ALT!==VER){ img._alt=true; img.src=img.src.replace('/cdn/'+VER+'/','/cdn/'+VER_ALT+'/'); return; }
  img.onerror=null; img.style.visibility='hidden';
}
// Sources d'icône de champion, par ordre de préférence :
// local (repo) → ddragon → patch précédent → miroir Community Dragon.
function wChampCands(id){
  const out=[];
  if(WIKI_LOCAL) out.push(localIcon(id));
  if(VER) out.push(`${DD}/cdn/${VER}/img/champion/${id}.png`);
  if(VER && VER_ALT && VER_ALT!==VER) out.push(`${DD}/cdn/${VER_ALT}/img/champion/${id}.png`);
  if(KEY_BY_ID[id]) out.push(CD_ICON(KEY_BY_ID[id]));
  return out;
}
function wChampImg(img,id){
  if(!img) return;
  img._t=img._t||{}; if(img.src) img._t[img.src]=1;
  const next=wChampCands(id).find(u=>!img._t[u]);
  if(next){ img._t[next]=1; img.src=next; return; }
  img.onerror=null; img.style.visibility='hidden';
}

async function fetchJSON(url){ const r=await fetch(url); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function getVersion(){
  try{ const c=JSON.parse(localStorage.getItem('pz_ddver')||'null'); if(c&&c.v&&c.a&&c.t&&Date.now()-c.t<6*3600*1000){ VER=c.v; VER_ALT=c.a; return VER; } }catch(e){}
  const vs=await fetchJSON(DD+'/api/versions.json'); VER=vs[0]; VER_ALT=vs[1]||VER;
  try{ localStorage.setItem('pz_ddver',JSON.stringify({v:VER,a:VER_ALT,t:Date.now()})); }catch(e){}
  return VER;
}
function mapKeys(arr){ arr.forEach(x=>{ if(x.key) KEY_BY_ID[x.id]=x.key; }); return arr; }
async function getList(){
  // 0) Manifeste local (icônes du repo) — prioritaire et hors-ligne.
  try{
    const m=await fetch(MANIFEST,{cache:'no-cache'}).then(r=>r.ok?r.json():null);
    if(m && Array.isArray(m.champions) && m.champions.length){
      WIKI_LOCAL=true;
      if(m.version) VER=m.version;   // patch du manifeste (icônes de sorts + étiquette)
      // On récupère quand même les versions ddragon (VER_ALT), sans bloquer.
      getVersion().catch(()=>{});
      const list=m.champions.map(c=>({id:c.id,name:c.name,title:c.title||'',tags:c.tags||[],key:String(c.key||'')}))
        .sort((a,b)=>a.name.localeCompare(b.name,'fr'));
      return mapKeys(list);
    }
  }catch(e){}
  try{ await getVersion(); }catch(e){ /* ddragon injoignable : on tentera Community Dragon */ }
  if(VER){
    const key='pz_wiki_list2_'+VER;
    try{ const c=JSON.parse(localStorage.getItem(key)||'null'); if(c&&c.length) return mapKeys(c); }catch(e){}
    try{
      const data=await fetchJSON(`${DD}/cdn/${VER}/data/${LANG}/champion.json`);
      const list=Object.values(data.data).map(c=>({id:c.id,name:c.name,title:c.title,tags:c.tags||[],key:c.key}))
        .sort((a,b)=>a.name.localeCompare(b.name,'fr'));
      try{ localStorage.setItem(key,JSON.stringify(list)); }catch(e){}
      return mapKeys(list);
    }catch(e){ /* bascule sur Community Dragon */ }
  }
  // Filet Community Dragon (indépendant de ddragon) : noms + clés d'icônes.
  const sum=await fetchJSON(CD_SUMMARY);
  const list=sum.filter(c=>c&&c.id>0).map(c=>({id:c.alias,name:c.name,title:'',tags:[],key:String(c.id)}))
    .sort((a,b)=>a.name.localeCompare(b.name,'fr'));
  return mapKeys(list);
}
async function getChamp(id){
  await getVersion();
  const key='pz_wiki_c_'+VER+'_'+id;
  try{ const c=JSON.parse(localStorage.getItem(key)||'null'); if(c) return c; }catch(e){}
  const data=await fetchJSON(`${DD}/cdn/${VER}/data/${LANG}/champion/${id}.json`);
  const c=data.data[id];
  try{ localStorage.setItem(key,JSON.stringify(c)); }catch(e){}
  return c;
}
const champIcon=id=> wChampCands(id)[0] || '';
const spellIcon=f=>`${DD}/cdn/${VER}/img/spell/${f}`;
const passiveIcon=f=>`${DD}/cdn/${VER}/img/passive/${f}`;
const splash=id=>`${DD}/cdn/img/champion/splash/${id}_0.jpg`;

// ── Liste ──
function renderFilters(){
  const tags=Object.keys(TAG_FR);
  document.getElementById('wikiFilters').innerHTML =
    `<span class="wf${activeTag===''?' on':''}" data-tag="">Tous</span>` +
    tags.map(t=>`<span class="wf${activeTag===t?' on':''}" data-tag="${t}">${TAG_FR[t]}</span>`).join('');
}
function renderGrid(){
  const q=(document.getElementById('wikiSearch').value||'').trim().toLowerCase();
  const items=LIST.filter(c=>
    (!activeTag || c.tags.includes(activeTag)) &&
    (!q || c.name.toLowerCase().includes(q) || c.id.toLowerCase().includes(q))
  );
  const g=document.getElementById('wikiGrid');
  if(!items.length){ g.innerHTML='<div class="wiki-empty">Aucun champion trouvé.</div>'; return; }
  g.innerHTML=items.map(c=>`<button class="wtile" data-id="${c.id}">
    <img src="${champIcon(c.id)}" alt="${esc(c.name)}" loading="lazy" onerror="wChampImg(this,'${c.id}')">
    <span class="nm">${esc(c.name)}</span>
    <span class="rl">${(c.tags||[]).map(t=>TAG_FR[t]||t).join(' · ')}</span>
  </button>`).join('');
}
document.getElementById('wikiSearch').addEventListener('input', renderGrid);
document.getElementById('wikiFilters').addEventListener('click', e=>{ const el=e.target.closest('.wf'); if(!el)return; activeTag=el.dataset.tag; renderFilters(); renderGrid(); });
document.getElementById('wikiGrid').addEventListener('click', e=>{ const el=e.target.closest('.wtile'); if(el) openChamp(el.dataset.id); });

// ── Détail ──
function showList(){ document.getElementById('listView').style.display=''; document.getElementById('wdetail').style.display='none'; if(location.hash) history.replaceState(null,'','#'); }
document.getElementById('wback').addEventListener('click', showList);

async function openChamp(id){
  const body=document.getElementById('wdBody');
  document.getElementById('listView').style.display='none';
  document.getElementById('wdetail').style.display='block';
  body.innerHTML='<div class="wiki-empty">Chargement…</div>';
  history.replaceState(null,'','#'+id);
  window.scrollTo({top:0,behavior:'smooth'});
  let c; try{ c=await getChamp(id); }catch(e){ body.innerHTML='<div class="wiki-empty">Impossible de charger ce champion (hors-ligne ?).</div>'; return; }
  const keys=['Q','W','E','R'];
  const spells=(c.spells||[]).map((s,i)=>`
    <div class="spell" data-slot="${keys[i]||''}">
      <div class="spell-ico"><img src="${spellIcon(s.image.full)}" alt="" onerror="wImgAlt(this)"><span class="spell-key">${keys[i]||''}</span></div>
      <div class="spell-body">
        <div class="spell-name">${esc(s.name)}</div>
        <div class="spell-meta">
          ${s.cooldownBurn&&s.cooldownBurn!=='0'?`<span><b>CD</b> ${esc(s.cooldownBurn)}s</span>`:''}
          ${s.costBurn&&s.costBurn!=='0'?`<span><b>Coût</b> ${esc(s.costBurn)}</span>`:''}
          ${s.rangeBurn&&s.rangeBurn!=='0'&&s.rangeBurn!=='self'?`<span><b>Portée</b> ${esc(s.rangeBurn)}</span>`:''}
        </div>
        <div class="spell-desc">${safeHtml(resolveTooltip(s))}</div>
      </div>
    </div>`).join('');
  const passive=c.passive?`
    <div class="spell" data-slot="P">
      <div class="spell-ico"><img src="${passiveIcon(c.passive.image.full)}" alt="" onerror="wImgAlt(this)"><span class="spell-key" style="background:var(--muted)">P</span></div>
      <div class="spell-body"><div class="spell-name">${esc(c.passive.name)}</div><div class="spell-desc">${safeHtml(c.passive.description)}</div></div>
    </div>`:'';
  const st=c.stats||{};
  const round=n=>Math.round((+n||0)*100)/100;
  const statTiles=STAT_LABELS.map(([k,l,pl])=>{
    if(st[k]==null) return '';
    let v=round(st[k]); if(k==='attackspeed') v=round(st[k]);
    return `<div class="stat"><div class="k">${l}</div><div class="v">${v}</div>${pl&&st[pl]?`<div class="pl">+${round(st[pl])}/niv</div>`:''}</div>`;
  }).filter(Boolean).join('');
  const tipBox=(title,arr,color)=> (arr&&arr.length)?`<div class="tipbox"><div class="t" style="color:${color}">${title}</div><ul>${arr.slice(0,5).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:'';
  const tips=(c.allytips&&c.allytips.length)||(c.enemytips&&c.enemytips.length)
    ? `<div class="wd-sec-t">Conseils</div><div class="tips">${tipBox('Jouer avec',c.allytips,'var(--ok)')}${tipBox('Jouer contre',c.enemytips,'var(--err)')}</div>` : '';

  body.innerHTML=`
    <div class="wd-hero">
      <div class="bg" style="background-image:url('${splash(id)}')"></div><div class="grad"></div>
      <div class="inner">
        <img class="ico" src="${champIcon(id)}" alt="" onerror="wChampImg(this,'${id}')">
        <div>
          <div class="wd-name">${esc(c.name)}</div>
          <div class="wd-title">${esc(c.title)}</div>
          <div class="wd-tags">${(c.tags||[]).map(t=>`<span class="wd-tag">${TAG_FR[t]||t}</span>`).join('')}${c.partype?`<span class="wd-tag res">${esc(c.partype)}</span>`:''}</div>
        </div>
      </div>
    </div>
    <div class="wd-sec-t">Compétences</div>
    ${passive}${spells}
    <div class="wd-sec-t">Statistiques de base</div>
    <div class="stats">${statTiles}</div>
    ${tips}`;
  // Enrichissement non-bloquant : chiffres précis par rang via Meraki Analytics.
  enrichMeraki(id);
}

// ── Init ──
(async()=>{
  try{
    LIST=await getList();
    document.getElementById('patchVer').textContent=VER?('Patch '+VER):'Miroir communautaire';
    renderFilters(); renderGrid();
    const h=(location.hash||'').replace(/^#/,'').trim();
    if(h && LIST.some(c=>c.id===h)) openChamp(h);
  }catch(e){
    console.error(e);
    document.getElementById('wikiGrid').innerHTML='<div class="wiki-empty">Impossible de charger les données des champions (connexion ?). Réessaie plus tard.</div>';
  }
  PZ.loadingDone();
})();
window.addEventListener('hashchange',()=>{ const h=(location.hash||'').replace(/^#/,'').trim(); if(h && LIST.some(c=>c.id===h)) openChamp(h); else showList(); });
</script>
</body>
</html>
