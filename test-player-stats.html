<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test — Stats joueurs LoL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b0f14;--surface:#111620;--surface-2:#161c27;
    --border:rgba(255,255,255,.07);--border-2:rgba(255,255,255,.13);
    --text:#e8eaf0;--dim:#9ba3b2;--muted:#5a6272;
    --accent:#22d3ee;--ok:#22c55e;--err:#ef4444;--warn:#fbbf24;
    --r:10px;--font:'Manrope',sans-serif;--font-display:'Sora',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);
    min-height:100vh;padding:32px 16px}

  .wrap{max-width:820px;margin:0 auto}
  h1{font-family:var(--font-display);font-size:1.3rem;font-weight:700;margin-bottom:4px}
  .sub{font-size:12px;color:var(--muted);margin-bottom:28px}

  .meta-bar{display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:10px;margin-bottom:20px}
  .update-time{font-size:12px;color:var(--muted)}
  .btn-refresh{background:var(--surface-2);border:1px solid var(--border-2);border-radius:8px;
    padding:7px 14px;color:var(--dim);font-family:var(--font);font-size:12px;font-weight:600;
    cursor:pointer;transition:border-color .15s,color .15s}
  .btn-refresh:hover{border-color:var(--accent);color:var(--accent)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}

  .pcard{background:var(--surface);border:1px solid var(--border-2);border-radius:14px;padding:20px;
    display:flex;flex-direction:column;gap:12px}
  .pcard-head{display:flex;align-items:center;gap:10px}
  .pcard-ico{width:42px;height:42px;border-radius:10px;background:var(--surface-2);
    border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0}
  .pcard-name{font-family:var(--font-display);font-size:15px;font-weight:700;line-height:1.2}
  .pcard-tag{font-size:11px;color:var(--muted);margin-top:1px}
  .role-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;padding:2px 7px;border-radius:5px;
    background:var(--surface-2);border:1px solid var(--border-2);color:var(--dim)}

  .rank-row{display:flex;align-items:center;gap:10px;
    background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .rank-ico{font-size:26px;flex-shrink:0}
  .rank-tier{font-family:var(--font-display);font-size:15px;font-weight:700}
  .rank-lp{font-size:12px;color:var(--dim);margin-top:2px}

  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;
    padding:10px 12px;text-align:center}
  .stat .lbl{font-size:9px;text-transform:uppercase;letter-spacing:.07em;
    color:var(--muted);font-weight:600;margin-bottom:4px}
  .stat .val{font-family:var(--font-display);font-size:1.2rem;font-weight:700}
  .ok{color:var(--ok)}.er{color:var(--err)}.ac{color:var(--accent)}.wn{color:var(--warn)}

  .unranked{font-size:12px;color:var(--muted);font-style:italic;
    text-align:center;padding:10px;border:1px dashed var(--border-2);border-radius:9px}
  .pcard-err{font-size:12px;color:#f87171;background:rgba(239,68,68,.08);
    border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:10px}

  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  .empty h2{font-size:1rem;font-weight:600;margin-bottom:8px;color:var(--dim)}
  .empty code{background:var(--surface-2);border:1px solid var(--border-2);border-radius:6px;
    padding:10px 16px;display:inline-block;font-size:12px;color:var(--accent);margin-top:8px;
    text-align:left;line-height:1.8}

  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--border-2);
    border-top-color:var(--accent);border-radius:50%;animation:sp .6s linear infinite;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Stats joueurs — Prototype</h1>
  <p class="sub">Données chargées depuis <code>stats-output.json</code> · aucune clé API dans le navigateur</p>

  <div class="meta-bar">
    <span class="update-time" id="updateTime">Chargement…</span>
    <button class="btn-refresh" onclick="load()">↻ Actualiser</button>
  </div>

  <div class="grid" id="grid">
    <div class="empty"><span class="spin"></span>Chargement…</div>
  </div>
</div>

<script>
'use strict';

const TIER_EMOJI = {
  IRON:'⚫', BRONZE:'🟤', SILVER:'🪨', GOLD:'🟡',
  PLATINUM:'🟢', EMERALD:'💎', DIAMOND:'🔷',
  MASTER:'🔴', GRANDMASTER:'🔴', CHALLENGER:'🏆'
};
const ROLE_EMOJI = {
  Top:'🛡️', Jungle:'🌿', Mid:'⚡', ADC:'🏹', Support:'🌟',
  Top:'🛡️', Jungle:'🌿', Mid:'⚡', Bot:'🏹', Support:'🌟'
};

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderCard(p) {
  const card = document.createElement('div');
  card.className = 'pcard';

  const roleEmoji = ROLE_EMOJI[p.role] || '🎮';
  const head = `
    <div class="pcard-head">
      <div class="pcard-ico">${roleEmoji}</div>
      <div>
        <div class="pcard-name">${esc(p.name)}</div>
        <div class="pcard-tag">#${esc(p.tag)}</div>
      </div>
      <span class="role-badge" style="margin-left:auto">${esc(p.role)}</span>
    </div>`;

  if (p.error) {
    card.innerHTML = head + `<div class="pcard-err">✗ ${esc(p.error)}</div>`;
    return card;
  }

  const s = p.solo;
  let rankHtml, statsHtml;

  if (!s) {
    rankHtml = '<div class="unranked">Non classé · Solo/Duo</div>';
    statsHtml = '';
  } else {
    const noDiv = ['MASTER','GRANDMASTER','CHALLENGER'].includes(s.tier);
    const tierLabel = s.tier.charAt(0) + s.tier.slice(1).toLowerCase();
    const divLabel = noDiv ? '' : ' ' + s.rank;
    const total = s.wins + s.losses;
    const wr = total > 0 ? Math.round(s.wins / total * 100) : 0;
    const wrCls = wr >= 55 ? 'ok' : wr >= 45 ? 'ac' : 'wn';

    rankHtml = `
      <div class="rank-row">
        <span class="rank-ico">${TIER_EMOJI[s.tier] || '🏅'}</span>
        <div>
          <div class="rank-tier">${tierLabel}${divLabel}</div>
          <div class="rank-lp">${s.lp} LP</div>
        </div>
      </div>`;

    statsHtml = `
      <div class="stats-row">
        <div class="stat"><div class="lbl">Win rate</div><div class="val ${wrCls}">${wr}%</div></div>
        <div class="stat"><div class="lbl">Victoires</div><div class="val ok">${s.wins}</div></div>
        <div class="stat"><div class="lbl">Défaites</div><div class="val er">${s.losses}</div></div>
      </div>`;
  }

  card.innerHTML = head + rankHtml + statsHtml;
  return card;
}

async function load() {
  const grid = document.getElementById('grid');
  const timeEl = document.getElementById('updateTime');
  grid.innerHTML = '<div class="empty"><span class="spin"></span>Chargement…</div>';

  try {
    // ?t= évite le cache navigateur à chaque refresh
    const res = await fetch('./stats-output.json?t=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    if (!data.players || data.players.length === 0) {
      grid.innerHTML = `
        <div class="empty" style="grid-column:1/-1">
          <h2>Aucune donnée</h2>
          <p>Lance l'Action GitHub pour récupérer les stats :</p>
          <code>
            1. Édite <b>player-config.json</b> avec les Riot IDs<br>
            2. Ajoute <b>RIOT_API_KEY</b> dans les Secrets GitHub<br>
            3. Actions → "Fetch player stats" → Run workflow
          </code>
        </div>`;
      timeEl.textContent = 'Aucune donnée — action non encore lancée';
      return;
    }

    if (data.updatedAt) {
      const d = new Date(data.updatedAt);
      timeEl.textContent = 'Mis à jour le ' + d.toLocaleString('fr-FR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
    } else {
      timeEl.textContent = '';
    }

    grid.innerHTML = '';
    data.players.forEach(p => grid.appendChild(renderCard(p)));
  } catch(e) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <h2>Impossible de charger stats-output.json</h2>
      <p>${esc(e.message)}</p>
    </div>`;
    timeEl.textContent = '';
  }
}

load();
</script>
</body>
</html>
