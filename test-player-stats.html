<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test — Stats joueur LoL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b0f14;--surface:#111620;--surface-2:#161c27;
    --border:rgba(255,255,255,.07);--border-2:rgba(255,255,255,.13);
    --text:#e8eaf0;--dim:#9ba3b2;--muted:#5a6272;
    --accent:#22d3ee;--ok:#22c55e;--err:#ef4444;--warn:#fbbf24;
    --r:10px;--font:'Manrope',sans-serif;--font-display:'Sora',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px}

  .card{background:var(--surface);border:1px solid var(--border-2);border-radius:16px;
    padding:32px;width:100%;max-width:520px}
  .card-title{font-family:var(--font-display);font-size:1.15rem;font-weight:700;margin-bottom:3px}
  .card-sub{font-size:12px;color:var(--muted);margin-bottom:28px}

  .field{margin-bottom:14px}
  label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  input,select{
    width:100%;background:var(--surface-2);border:1px solid var(--border-2);border-radius:8px;
    padding:10px 12px;color:var(--text);font-family:var(--font);font-size:14px;
    outline:none;transition:border-color .15s
  }
  input:focus,select:focus{border-color:var(--accent)}
  select option{background:var(--surface-2)}
  .row{display:grid;grid-template-columns:1fr 120px;gap:10px}

  .btn{
    width:100%;background:var(--accent);color:#04222a;border:none;border-radius:8px;
    padding:12px;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;
    margin-top:6px;transition:filter .15s;
    display:flex;align-items:center;justify-content:center;gap:8px
  }
  .btn:hover{filter:brightness(1.1)}
  .btn:disabled{opacity:.5;cursor:not-allowed;filter:none}

  .spin{width:14px;height:14px;border:2px solid rgba(4,34,42,.25);
    border-top-color:#04222a;border-radius:50%;animation:s .6s linear infinite;flex-shrink:0}
  @keyframes s{to{transform:rotate(360deg)}}

  .error{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:8px;
    padding:12px 14px;color:#f87171;font-size:13px;margin-top:14px;display:none;line-height:1.5}
  .error.show{display:block}

  .result{margin-top:24px;border-top:1px solid var(--border);padding-top:22px;display:none}
  .result.show{display:block}

  .pname{font-family:var(--font-display);font-size:1.15rem;font-weight:700;margin-bottom:16px}
  .pname .tag{color:var(--muted);font-size:.8em;font-weight:500}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

  .rank-tile{
    grid-column:1/-1;display:flex;align-items:center;gap:16px;
    background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--r);padding:16px
  }
  .rank-ico{
    width:60px;height:60px;border-radius:12px;background:var(--surface);
    border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;
    font-size:30px;flex-shrink:0
  }
  .rank-label{font-family:var(--font-display);font-size:1.1rem;font-weight:700}
  .rank-lp{font-size:13px;color:var(--dim);margin-top:3px}

  .stat-tile{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
  .stat-tile .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);font-weight:600;margin-bottom:6px}
  .stat-tile .val{font-family:var(--font-display);font-size:1.5rem;font-weight:700}
  .ok{color:var(--ok)}.er{color:var(--err)}.ac{color:var(--accent)}.wn{color:var(--warn)}

  .unranked{grid-column:1/-1;background:var(--surface-2);border:1px solid var(--border);
    border-radius:var(--r);padding:16px;color:var(--muted);font-size:14px;text-align:center}

  .source-note{margin-top:16px;font-size:11px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="card-title">Stats joueur — Prototype</div>
  <div class="card-sub">Sans clé API · données op.gg · branche test</div>

  <div class="field">
    <label>Riot ID (Pseudo#TAG)</label>
    <div class="row">
      <input type="text" id="riotId" placeholder="HaitoDann#EUW" spellcheck="false" autocomplete="off">
      <select id="region">
        <option value="euw">EUW</option>
        <option value="na">NA</option>
        <option value="eune">EUNE</option>
        <option value="kr">KR</option>
        <option value="br">BR</option>
        <option value="tr">TR</option>
        <option value="jp">JP</option>
        <option value="oce">OCE</option>
      </select>
    </div>
  </div>

  <button class="btn" id="fetchBtn" onclick="run()">Rechercher</button>

  <div class="error" id="errBox"></div>

  <div class="result" id="result">
    <div class="pname" id="pname"></div>
    <div class="stats" id="stats"></div>
    <div class="source-note">Source : op.gg (données publiques)</div>
  </div>
</div>

<script>
'use strict';

const TIER_EMOJI = {
  IRON:'⚫', BRONZE:'🟤', SILVER:'🪨', GOLD:'🟡',
  PLATINUM:'🟢', EMERALD:'💎', DIAMOND:'🔷',
  MASTER:'🔴', GRANDMASTER:'🔴', CHALLENGER:'🏆'
};
const DIV = {1:'I', 2:'II', 3:'III', 4:'IV'};

// Deux proxies CORS en série — on essaie le second si le premier échoue.
const PROXIES = [
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
];

const $ = id => document.getElementById(id);

function showErr(msg) { $('errBox').innerHTML = msg; $('errBox').classList.add('show'); }
function hideErr()    { $('errBox').classList.remove('show'); }

async function fetchHtml(url) {
  let lastErr;
  for (const proxy of PROXIES) {
    try {
      const res = await fetch(proxy(url), { signal: AbortSignal.timeout(12000) });
      if (res.ok) return await res.text();
      lastErr = new Error(`Proxy HTTP ${res.status}`);
    } catch(e) { lastErr = e; }
  }
  throw lastErr ?? new Error('Proxies inaccessibles.');
}

function parseNextData(html) {
  const m = html.match(/<script id="__NEXT_DATA__" type="application\/json">([\s\S]*?)<\/script>/);
  if (!m) throw new Error('Structure op.gg non reconnue — le site a peut-être changé.');
  return JSON.parse(m[1]);
}

// Cherche les données de rang dans le JSON (plusieurs chemins selon version op.gg)
function extractSummoner(nd) {
  return nd?.props?.pageProps?.data?.summoner
    ?? nd?.props?.pageProps?.summoner
    ?? nd?.props?.pageProps?.data
    ?? null;
}

function normRank(r) {
  if (!r) return null;
  return {
    tier:   (r.tier ?? r.queue_type ?? '').toUpperCase(),
    div:    DIV[r.division] ?? r.division ?? '',
    lp:     r.lp ?? r.league_points ?? 0,
    wins:   r.win ?? r.wins ?? 0,
    losses: r.lose ?? r.losses ?? 0,
  };
}

async function run() {
  hideErr();
  $('result').classList.remove('show');

  const raw = $('riotId').value.trim();
  const region = $('region').value;

  if (!raw.includes('#')) {
    showErr('Format attendu : <b>Pseudo#TAG</b> — exemple : HaitoDann#EUW');
    return;
  }
  const [name, tag] = raw.split('#');

  const btn = $('fetchBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spin"></div>Récupération…';

  try {
    const opggUrl = `https://www.op.gg/summoners/${region}/${encodeURIComponent(name)}-${encodeURIComponent(tag)}`;
    const html = await fetchHtml(opggUrl);
    const nd   = parseNextData(html);
    const smn  = extractSummoner(nd);

    if (!smn) throw new Error('Profil introuvable ou joueur inconnu sur op.gg.');

    const solo = normRank(smn.solo_tier_info ?? smn.tier_info);
    const displayName = smn.game_name ?? smn.name ?? name;
    const displayTag  = smn.tag_line  ?? smn.tag  ?? tag;

    $('pname').innerHTML = `${displayName} <span class="tag">#${displayTag}</span>`;

    if (!solo || !solo.tier) {
      $('stats').innerHTML = '<div class="unranked">Aucune partie Solo/Duo classée cette saison.</div>';
    } else {
      const total = solo.wins + solo.losses;
      const wr    = total > 0 ? Math.round(solo.wins / total * 100) : 0;
      const wrCls = wr >= 55 ? 'ok' : wr >= 45 ? 'ac' : 'wn';
      const noDiv = ['MASTER','GRANDMASTER','CHALLENGER'].includes(solo.tier);
      const tierLabel = solo.tier.charAt(0) + solo.tier.slice(1).toLowerCase();

      $('stats').innerHTML = `
        <div class="rank-tile">
          <div class="rank-ico">${TIER_EMOJI[solo.tier] ?? '🏅'}</div>
          <div>
            <div class="rank-label">${tierLabel}${noDiv ? '' : ' ' + solo.div}</div>
            <div class="rank-lp">${solo.lp} LP · Solo/Duo</div>
          </div>
        </div>
        <div class="stat-tile">
          <div class="lbl">Victoires</div>
          <div class="val ok">${solo.wins}</div>
        </div>
        <div class="stat-tile">
          <div class="lbl">Défaites</div>
          <div class="val er">${solo.losses}</div>
        </div>
        <div class="stat-tile">
          <div class="lbl">Win Rate</div>
          <div class="val ${wrCls}">${wr}%</div>
        </div>
        <div class="stat-tile">
          <div class="lbl">Parties jouées</div>
          <div class="val ac">${total}</div>
        </div>`;
    }

    $('result').classList.add('show');
  } catch(e) {
    const msg = e.message ?? 'Erreur inconnue.';
    // Si ça vient du parsing JSON, on donne un message plus utile
    if (msg.includes('JSON') || msg.includes('Structure')) {
      showErr(`op.gg a changé sa structure — parsing impossible.<br><small style="opacity:.7">${msg}</small>`);
    } else {
      showErr(msg);
    }
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Rechercher';
  }
}

['riotId'].forEach(id => {
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
});
</script>
</body>
</html>
