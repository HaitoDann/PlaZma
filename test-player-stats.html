<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test — Stats joueur LoL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b0f14;--surface:#111620;--surface-2:#161c27;
    --border:rgba(255,255,255,.07);--border-2:rgba(255,255,255,.13);
    --text:#e8eaf0;--dim:#9ba3b2;--muted:#5a6272;
    --accent:#22d3ee;--ok:#22c55e;--err:#ef4444;--warn:#fbbf24;
    --r:10px;--font:'Manrope',sans-serif;--font-display:'Sora',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px}

  .card{background:var(--surface);border:1px solid var(--border-2);border-radius:16px;
    padding:32px;width:100%;max-width:520px}

  .card-title{font-family:var(--font-display);font-size:1.15rem;font-weight:700;margin-bottom:3px}
  .card-sub{font-size:12px;color:var(--muted);margin-bottom:28px}

  .field{margin-bottom:14px}
  label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  input,select{
    width:100%;background:var(--surface-2);border:1px solid var(--border-2);border-radius:8px;
    padding:10px 12px;color:var(--text);font-family:var(--font);font-size:14px;
    outline:none;transition:border-color .15s
  }
  input:focus,select:focus{border-color:var(--accent)}
  input[type="password"]{letter-spacing:.12em}
  select option{background:var(--surface-2)}
  .key-note{font-size:11px;color:var(--muted);margin-top:5px}

  .row{display:grid;grid-template-columns:1fr 120px;gap:10px}

  .btn{
    width:100%;background:var(--accent);color:#04222a;border:none;border-radius:8px;
    padding:12px;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;
    margin-top:6px;transition:filter .15s;display:flex;align-items:center;justify-content:center;gap:8px
  }
  .btn:hover{filter:brightness(1.1)}
  .btn:disabled{opacity:.5;cursor:not-allowed;filter:none}

  /* Spinner */
  .spin{width:14px;height:14px;border:2px solid rgba(4,34,42,.25);
    border-top-color:#04222a;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Error */
  .error{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:8px;
    padding:12px 14px;color:#f87171;font-size:13px;margin-top:14px;display:none}
  .error.show{display:block}

  /* Results */
  .result{margin-top:24px;border-top:1px solid var(--border);padding-top:22px;display:none}
  .result.show{display:block}

  .pname{font-family:var(--font-display);font-size:1.15rem;font-weight:700;margin-bottom:16px}
  .pname .tag{color:var(--muted);font-size:.8em;font-weight:500}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

  .rank-tile{
    grid-column:1/-1;display:flex;align-items:center;gap:16px;
    background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--r);padding:16px
  }
  .rank-ico{
    width:60px;height:60px;border-radius:12px;background:var(--surface);
    border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;
    font-size:30px;flex-shrink:0
  }
  .rank-label{font-family:var(--font-display);font-size:1.1rem;font-weight:700}
  .rank-lp{font-size:13px;color:var(--dim);margin-top:3px}

  .stat-tile{
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px
  }
  .stat-tile .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
    font-weight:600;margin-bottom:6px}
  .stat-tile .val{font-family:var(--font-display);font-size:1.5rem;font-weight:700}
  .ok{color:var(--ok)}.err{color:var(--err)}.acc{color:var(--accent)}.warn{color:var(--warn)}

  .unranked{
    grid-column:1/-1;background:var(--surface-2);border:1px solid var(--border);
    border-radius:var(--r);padding:16px;color:var(--muted);font-size:14px;text-align:center
  }
</style>
</head>
<body>
<div class="card">
  <div class="card-title">Stats joueur — Prototype</div>
  <div class="card-sub">Test ARCHI · données Solo/Duo · non déployé en production</div>

  <div class="field">
    <label>Clé API Riot Developer (dev key, 24h)</label>
    <input type="password" id="apiKey" placeholder="RGAPI-XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX" autocomplete="off" spellcheck="false">
    <div class="key-note">Stockée dans ton navigateur uniquement — jamais envoyée ailleurs que Riot.</div>
  </div>

  <div class="field">
    <label>Riot ID (Pseudo#TAG)</label>
    <div class="row">
      <input type="text" id="riotId" placeholder="HaitoDann#EUW" spellcheck="false">
      <select id="region">
        <option value="euw1|europe">EUW</option>
        <option value="na1|americas">NA</option>
        <option value="eun1|europe">EUNE</option>
        <option value="kr|asia">KR</option>
        <option value="br1|americas">BR</option>
        <option value="tr1|europe">TR</option>
        <option value="jp1|asia">JP</option>
        <option value="oc1|sea">OCE</option>
      </select>
    </div>
  </div>

  <button class="btn" id="fetchBtn" onclick="run()">Récupérer les stats</button>

  <div class="error" id="errBox"></div>

  <div class="result" id="result">
    <div class="pname" id="pname"></div>
    <div class="stats" id="stats"></div>
  </div>
</div>

<script>
'use strict';

// corsproxy.io relaie la requête côté serveur et ajoute les headers CORS manquants.
// Nécessaire car Riot bloque les appels navigateur directs (pas d'Access-Control-Allow-Origin).
const PROXY = 'https://corsproxy.io/?';

const TIER_EMOJI = {
  IRON:'⚫', BRONZE:'🟤', SILVER:'🪨', GOLD:'🟡',
  PLATINUM:'🟢', EMERALD:'💎', DIAMOND:'🔷',
  MASTER:'🔴', GRANDMASTER:'🔴', CHALLENGER:'🏆'
};

const $ = id => document.getElementById(id);

// Restore de la clé sauvegardée
const saved = localStorage.getItem('riot_dev_key_test');
if (saved) $('apiKey').value = saved;

function showErr(msg) { $('errBox').textContent = msg; $('errBox').classList.add('show'); }
function hideErr() { $('errBox').classList.remove('show'); }

async function get(url) {
  const res = await fetch(PROXY + encodeURIComponent(url));
  const body = await res.text();
  let json;
  try { json = JSON.parse(body); } catch { throw new Error('Réponse invalide du proxy.'); }
  if (!res.ok) {
    const msg = json?.status?.message || json?.message || `HTTP ${res.status}`;
    throw new Error(`Riot API — ${msg}`);
  }
  return json;
}

async function run() {
  hideErr();
  $('result').classList.remove('show');

  const key = $('apiKey').value.trim();
  const riotId = $('riotId').value.trim();
  const [platform, accountRegion] = $('region').value.split('|');

  if (!key) { showErr('Renseigne ta clé API (developer.riotgames.com → Regenerate).'); return; }
  if (!riotId.includes('#')) { showErr('Format attendu : Pseudo#TAG — ex: HaitoDann#EUW'); return; }

  localStorage.setItem('riot_dev_key_test', key);

  const [name, tag] = riotId.split('#');
  const btn = $('fetchBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spin"></div>Récupération…';

  try {
    // 1 — PUUID via Riot Account API (endpoint continental)
    const account = await get(
      `https://${accountRegion}.api.riotgames.com/riot/account/v1/accounts/by-riot-id/`
      + `${encodeURIComponent(name)}/${encodeURIComponent(tag)}?api_key=${key}`
    );

    // 2 — summonerId via Summoner API (endpoint régional)
    const summoner = await get(
      `https://${platform}.api.riotgames.com/lol/summoner/v4/summoners/by-puuid/`
      + `${account.puuid}?api_key=${key}`
    );

    // 3 — Ranked entries
    const entries = await get(
      `https://${platform}.api.riotgames.com/lol/league/v4/entries/by-summoner/`
      + `${summoner.id}?api_key=${key}`
    );

    const solo = entries.find(e => e.queueType === 'RANKED_SOLO_5x5');

    $('pname').innerHTML = `${account.gameName} <span class="tag">#${account.tagLine}</span>`;

    if (!solo) {
      $('stats').innerHTML = '<div class="unranked">Aucune partie classée en Solo/Duo cette saison.</div>';
    } else {
      const total = solo.wins + solo.losses;
      const wr = Math.round(solo.wins / total * 100);
      const wrClass = wr >= 55 ? 'ok' : wr >= 45 ? 'acc' : 'warn';
      const tierLabel = solo.tier.charAt(0) + solo.tier.slice(1).toLowerCase();
      const divLabel = ['MASTER','GRANDMASTER','CHALLENGER'].includes(solo.tier) ? '' : ' ' + solo.rank;

      $('stats').innerHTML = `
        <div class="rank-tile">
          <div class="rank-ico">${TIER_EMOJI[solo.tier] ?? '🏅'}</div>
          <div>
            <div class="rank-label">${tierLabel}${divLabel}</div>
            <div class="rank-lp">${solo.leaguePoints} LP · Solo/Duo</div>
          </div>
        </div>
        <div class="stat-tile">
          <div class="lbl">Victoires</div>
          <div class="val ok">${solo.wins}</div>
        </div>
        <div class="stat-tile">
          <div class="lbl">Défaites</div>
          <div class="val err">${solo.losses}</div>
        </div>
        <div class="stat-tile">
          <div class="lbl">Win Rate</div>
          <div class="val ${wrClass}">${wr}%</div>
        </div>
        <div class="stat-tile">
          <div class="lbl">Parties jouées</div>
          <div class="val acc">${total}</div>
        </div>`;
    }

    $('result').classList.add('show');
  } catch(e) {
    showErr(e.message ?? 'Erreur inconnue. Vérifie la clé API et le Riot ID.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Récupérer les stats';
  }
}

['riotId','apiKey'].forEach(id => {
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
});
</script>
</body>
</html>
