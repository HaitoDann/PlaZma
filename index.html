<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<style>
  body{display:flex;flex-direction:column;align-items:center;padding-bottom:56px}
  .home{width:100%;max-width:var(--page-max);padding:0 var(--gut)}
  #scroll-prog{display:none}

  /* En-tête */
  .hero{display:flex;align-items:center;gap:14px;padding:40px 0 8px;border-bottom:1px solid var(--border);padding-bottom:24px}
  .hero-logo{width:40px;height:32px;background:url(assets/logo-plazma.png) center/contain no-repeat;flex-shrink:0}
  .hero-logo span{display:none}
  .hero h1{font-size:22px;font-weight:600;letter-spacing:.02em;margin:0}
  .hero-sep{display:none}
  .hero-sub{color:var(--dim);font-size:14px}

  /* Actions haut-droite */
  #topFabs{position:fixed;top:14px;right:16px;z-index:50;display:flex;align-items:center;gap:6px}
  #topFabs [hidden]{display:none}
  .acct-fab{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r);
    background:transparent;border:1px solid var(--border);color:var(--dim);transition:color .12s,border-color .12s,background .12s}
  .acct-fab:hover{color:var(--text);border-color:var(--border-2);background:var(--surface-2)}
  #logoutFab:hover{color:var(--err)}
  .acct-fab svg{width:17px;height:17px}
  #ideasFab .bulb-rays{opacity:0}

  /* Sections */
  .sec{margin-top:36px}
  .sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
  .sec-head h2{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
  .sec-head .line{flex:1;height:1px;background:var(--border)}

  /* Outils : liste en grille, à plat */
  .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
  .tool{display:flex;align-items:center;gap:12px;background:var(--surface);padding:16px 18px;transition:background .12s}
  .tool:hover{background:var(--surface-2)}
  .tool-ico{display:flex}
  .tool-ico svg{width:18px;height:18px;stroke:var(--muted);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0}
  .tool:hover .tool-ico svg{stroke:var(--accent)}
  .tool-name{font-size:14px;font-weight:500}
  .wd-ring{display:none}

  /* Roster */
  .roster{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .pcard{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 12px 14px;transition:border-color .12s,background .12s}
  .pcard:hover{border-color:var(--border-2);background:var(--surface-2)}
  .pcard-av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:600;font-size:15px;color:var(--text);background:var(--surface-2);
    box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--role,var(--accent)) 55%,transparent)}
  .pcard-name{font-size:14px;font-weight:600}
  .pcard-cta{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
  .pcard:hover .pcard-cta{color:var(--text)}
  .pcard-skel .pcard-av{background:var(--surface-2)!important;box-shadow:none}

  /* Staff */
  .staff{display:flex}
  .staff .pcard{flex-direction:row;align-items:center;gap:14px;text-align:left;min-width:240px;padding:14px 18px}

  footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--border);width:100%;
    display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;color:var(--muted);font-size:12px}
  footer a{color:var(--dim)}
  footer a:hover{color:var(--text)}
  footer .dot{color:var(--border-2)}

  @media(max-width:820px){.tools{grid-template-columns:repeat(2,1fr)}.roster{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:520px){.tools{grid-template-columns:1fr}.roster{grid-template-columns:repeat(2,1fr)}}
</style>

<script src="assets/plazma.js?v=20260930b"></script>
<script>
  /* Normalise la longueur des tracés d'icônes → tracé uniforme au survol */
  document.querySelectorAll('.tool-ico svg *').forEach(el => el.setAttribute('pathLength', '100'));

  /* #26 Scroll progress — throttlé en rAF + hauteur mise en cache (évite le
     layout thrashing qui faisait ramer la page à chaque molette) */
  (function(){
    const bar = document.getElementById('scroll-prog');
    let max = 0, ticking = false;
    const measure = () => { max = document.body.scrollHeight - innerHeight; };
    const update = () => { ticking = false; bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(scrollY / max, 1) : 0) + ')'; };
    measure();
    window.addEventListener('scroll', () => { if (!ticking){ ticking = true; requestAnimationFrame(update); } }, {passive:true});
    window.addEventListener('resize', () => { measure(); requestAnimationFrame(update); }, {passive:true});
    window.addEventListener('load', measure);
  })();

  /* #27 Scroll-reveal IntersectionObserver */
  const revealObs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const sec = entry.target;
      sec.classList.add('visible');
      sec.querySelectorAll('.tools,.roster,.staff').forEach(g => g.classList.add('revealed'));
      revealObs.unobserve(sec);
    });
  }, {threshold: 0.08});
  document.querySelectorAll('.sec').forEach(s => revealObs.observe(s));


  /* Roster & staff */
  const PERF_HREF = {top:'plazma-perf-top.html',jungle:'plazma-perf-jungler.html',mid:'plazma-perf-mid.html',adc:'plazma-perf-adc.html',support:'plazma-perf-supp.html'};
  const initialsOf = n => { n=(n||'').trim(); if(!n) return '•'; const w=n.split(/\s+/); return (w.length>1 ? w[0][0]+w[1][0] : n.slice(0,2)).toUpperCase(); };
  PZ.onRoster((roster, coach) => {
    document.getElementById('rosterGrid').innerHTML = roster.map(p => `
      <a class="pcard" href="${PERF_HREF[p.roleKey]}" style="--role:${p.color}">
        <div class="pcard-av">${initialsOf(p.name)}</div>
        <span class="role-badge" style="--role:${p.color}">${p.role}</span>
        <div class="pcard-name">${p.name}</div>
        <div class="pcard-cta">Voir la fiche <span class="pcard-arrow">→</span></div>
      </a>`).join('');
    document.getElementById('staffGrid').innerHTML = `
      <a class="pcard" href="plazma-coach.html" style="--role:${coach.color}">
        <div class="pcard-av">${initialsOf(coach.name)}</div>
        <div>
          <span class="role-badge" style="--role:${coach.color}">${coach.role}</span>
          <div class="pcard-name" style="margin-top:6px">${coach.name}</div>
          <div class="pcard-cta">Voir la fiche <span class="pcard-arrow">→</span></div>
        </div>
      </a>`;
    document.querySelectorAll('#sec-roster,#sec-staff').forEach(s => revealObs.observe(s));
  });

  /* Bouton admin */
  (function(){
    function reveal(){
      try { if(PZ.auth.isAdmin && PZ.auth.isAdmin()){ ['clubBtn','acctBtn','sysBtn'].forEach(id=>{ const b=document.getElementById(id); if(b) b.hidden=false; }); }} catch(e){}
    }
    if(window.PZ && PZ.auth && PZ.auth.onAuth) PZ.auth.onAuth(reveal);
    else if(window.PZ && PZ.auth && PZ.auth.ready) PZ.auth.ready.then(reveal).catch(()=>{});
  })();
</script>
