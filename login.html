<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/logo-plazma.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHI — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css?v=20260923pro">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
  .scene{display:none}
  .login{width:360px;max-width:100%}
  .login .glass{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:32px 28px 26px}
  .login-brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:22px;text-align:center}
  .login-mark{width:44px;height:36px;background:url(assets/logo-plazma.png) center/contain no-repeat;margin-bottom:6px}
  .login-mark span{display:none}
  .login h1{font-size:20px;font-weight:600;letter-spacing:.02em}
  .login-sub{font-size:13px;color:var(--muted)}
  .login label{display:block;margin:14px 0 6px;font-size:12.5px;color:var(--dim);font-weight:500}
  .login .field{position:relative}
  .login .field svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
  .login input{width:100%;padding:10px 12px 10px 36px;background:var(--bg);border:1px solid var(--border-2);
    border-radius:var(--r);color:var(--text);font-size:14px;font-family:var(--font)}
  .login input::placeholder{color:var(--muted)}
  .login input:focus{outline:none}
  .login input.has-eye{padding-right:40px}
  .login .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    background:none;border:0;cursor:pointer;color:var(--muted);border-radius:var(--r-sm);padding:0}
  .login .eye:hover{color:var(--text)}
  .login .eye svg{position:static;transform:none;width:16px;height:16px;color:inherit}
  .login .eye .eye-off{display:none}
  .login .eye.on .eye-on{display:none}
  .login .eye.on .eye-off{display:block}
  .err{min-height:16px;text-align:center;font-size:12.5px;color:var(--err);margin-top:10px;opacity:0}
  .err.show{opacity:1}
  .msg{text-align:center;font-size:12.5px;color:var(--ok);opacity:0}
  .msg.show{opacity:1;margin-top:6px}
  .login .btn{width:100%;margin-top:12px;padding:10px;border:0;cursor:pointer;border-radius:var(--r);
    font-family:var(--font);font-weight:600;font-size:14px;color:#fff;background:var(--accent);transition:background .12s}
  .login .btn:hover:not(:disabled){background:var(--accent-2)}
  .login .btn:disabled{opacity:.7;cursor:default}
  .login .btn.ok{background:var(--ok);pointer-events:none}
  .login .btn .chk{width:16px;height:16px;margin-right:4px;vertical-align:-3px}
  body{transition:opacity .25s ease}
  body.pz-leaving{opacity:0}
  .forgot{display:block;text-align:center;margin:14px auto 0;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<script>
  // Thème appliqué au plus tôt (clé partagée avec l'app : 'pz-theme')
  (function(){
    var t=null; try{ t=localStorage.getItem('pz-theme'); }catch(e){}
    if(!t) t=(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
    document.documentElement.setAttribute('data-theme', t);
  })();
  function toggleTheme(){
    var cur=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
    try{ localStorage.setItem('pz-theme', cur); }catch(e){}
    document.documentElement.setAttribute('data-theme', cur);
  }
</script>
<button class="pz-daynight pz-daynight--fab" type="button" aria-label="Basculer le thème" onclick="toggleTheme()">
  <span class="dn-stars"></span>
  <span class="dn-clouds"></span>
  <span class="dn-knob"></span>
</button>
<div class="login">
  <div class="glass">
    <div class="login-brand">
      <div class="login-mark" role="img" aria-label="Logo ARCHI"><span class="lf-wave"></span><span class="lf-half lf-left"></span><span class="lf-half lf-right"></span><span class="lf-flash"></span><span class="lf-glint"></span></div>
      <h1>ARCHI</h1>
      <div class="login-sub">Espace staff · PlaZma Esport</div>
    </div>
    <label for="user">Nom d'utilisateur</label>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <input type="text" id="user" placeholder="ton pseudo" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
    </div>
    <label for="pw">Mot de passe</label>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input type="password" id="pw" class="has-eye" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')login()">
      <button type="button" class="eye" id="eye" aria-label="Afficher le mot de passe" aria-pressed="false">
        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A9.8 9.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.05M6.7 6.7A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 4-.85"/><path d="M9.5 9.5a3 3 0 0 0 4.2 4.2"/></svg>
      </button>
    </div>
    <div class="err" id="err"></div>
    <div class="msg" id="msg"></div>
    <button class="btn" id="btn" onclick="login()">Se connecter</button>
    <div class="forgot" style="cursor:default">Mot de passe oublié ? Contacte un administrateur.</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyAKwNEbNa6f40oSMwGp6dcDY1ZY6hUN1Ks',
  authDomain: 'plazma-esport.firebaseapp.com',
  projectId: 'plazma-esport',
  storageBucket: 'plazma-esport.firebasestorage.app',
  messagingSenderId: '534325929279',
  appId: '1:534325929279:web:b507a46c601fa6625edf8a'
};
// Domaine interne : le pseudo devient "<pseudo>@archi.local" pour Firebase.
// ⚠️ Doit rester identique à USER_DOMAIN dans plazma.js et plazma-admin.html.
const USER_DOMAIN = 'archi.local';
const normUser = u => u.trim().toLowerCase().replace(/[^a-z0-9._-]/g, '');
const toEmail = u => normUser(u) + '@' + USER_DOMAIN;

if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();

const $ = id => document.getElementById(id);
function showErr(t){ const e=$('err'); e.textContent=t; e.classList.add('show'); $('msg').classList.remove('show'); }
function clearMsg(){ $('err').classList.remove('show'); $('msg').classList.remove('show'); }

const FR_ERR = {
  'auth/user-disabled': 'Ce compte a été désactivé.',
  'auth/user-not-found': 'Aucun compte pour ce nom d\'utilisateur.',
  'auth/wrong-password': 'Nom d\'utilisateur ou mot de passe incorrect.',
  'auth/invalid-credential': 'Nom d\'utilisateur ou mot de passe incorrect.',
  'auth/too-many-requests': 'Trop de tentatives. Réessaie dans un instant.',
  'auth/network-request-failed': 'Problème de connexion réseau.'
};
const frError = e => FR_ERR[e && e.code] || (e && e.message) || 'Erreur de connexion.';

// Déjà connecté → on entre directement.
let redirecting = false;
auth.onAuthStateChanged(u => { if (u && !redirecting) { redirecting = true; location.replace('index.html'); } });

function login(){
  clearMsg();
  const user = $('user').value;
  const pw = $('pw').value;
  if (!normUser(user) || !pw){ showErr('Renseigne ton nom d\'utilisateur et ton mot de passe.'); return; }
  const btn = $('btn'); btn.disabled = true; btn.textContent = 'Connexion…';
  auth.signInWithEmailAndPassword(toEmail(user), pw)
    .then(() => {
      redirecting = true;
      // Drapeau lu par plazma.js sur la page suivante → compte 1 connexion (jauges).
      try { sessionStorage.setItem('pz-just-logged-in', '1'); } catch (e) {}
      // Moment de succès : coche animée + rebond du socle, puis redirection.
      btn.classList.add('ok');
      btn.innerHTML = '<svg class="chk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5 11-11"/></svg> Connecté';
      const card = document.querySelector('.login');
      if (card) card.classList.add('win');
      // On laisse admirer la coche, puis fondu/plongée avant de basculer sur l'accueil.
      setTimeout(() => document.body.classList.add('pz-leaving'), 400);
      setTimeout(() => location.replace('index.html'), 650);
    })
    .catch(e => { showErr(frError(e)); btn.disabled = false; btn.textContent = 'Se connecter'; $('pw').value=''; $('pw').focus(); });
}

</script>

<script>
// Afficher / masquer le mot de passe (UI pure, indépendant de Firebase)
(function(){
  const inp = document.getElementById('pw'), eye = document.getElementById('eye');
  if (!inp || !eye) return;
  eye.addEventListener('click', () => {
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    eye.classList.toggle('on', show);
    eye.setAttribute('aria-pressed', show ? 'true' : 'false');
    eye.setAttribute('aria-label', show ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
    inp.focus();
  });
})();
</script>
</body>
</html>
