<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/logo-plazma.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHI — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css?v=20260821f">
<style>
  /* ============================================================
     ARCHI — Connexion
     Fond animé (sphères 3D + glow cyan) + carte glassmorphism.
     Identité PlaZma conservée : accent cyan, ambiance sombre.
     ============================================================ */

  html,body{height:100%}
  body{
    display:flex;align-items:center;justify-content:center;
    padding:24px;position:relative;overflow:hidden;
    background:
      radial-gradient(1100px 700px at 78% -10%, rgba(34,211,238,.16), transparent 60%),
      radial-gradient(900px 640px at 12% 112%, rgba(8,145,178,.20), transparent 62%),
      linear-gradient(160deg, #060a10 0%, #0a1017 46%, #070c12 100%);
  }

  /* ---- Décor : sphères 3D flottantes ---- */
  .scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .orb{
    position:absolute;border-radius:50%;
    filter:blur(.4px);
    background:
      radial-gradient(circle at 32% 28%, rgba(207,247,255,.85), rgba(103,232,249,.92) 18%, #22d3ee 44%, #0e7490 76%, #063847 100%);
    box-shadow:
      inset -14px -18px 40px rgba(2,20,28,.65),
      inset 10px 12px 30px rgba(186,238,250,.35),
      0 40px 90px rgba(6,58,71,.55),
      0 0 70px rgba(34,211,238,.30);
    animation:float 14s ease-in-out infinite;
  }
  .orb.teal{
    background:
      radial-gradient(circle at 34% 30%, rgba(198,250,244,.82), rgba(94,234,212,.9) 20%, #14b8a6 48%, #0f766e 78%, #053a38 100%);
    box-shadow:
      inset -12px -16px 38px rgba(2,26,24,.6),
      inset 8px 10px 26px rgba(190,248,240,.32),
      0 36px 80px rgba(5,58,56,.5),
      0 0 60px rgba(45,212,191,.26);
  }
  .o1{width:230px;height:230px;top:-46px;left:8%;animation-delay:-1s}
  .o2{width:150px;height:150px;top:26%;left:-58px;animation-delay:-5s}
  .o3{width:118px;height:118px;bottom:-30px;left:22%;animation-delay:-3s}
  .o4{width:96px;height:96px;top:8%;right:12%;animation-delay:-7s}
  .o5{width:200px;height:200px;bottom:-70px;right:6%;animation-delay:-2s}
  .o6{width:66px;height:66px;top:40%;right:4%;animation-delay:-9s}
  .o7{width:44px;height:44px;top:64%;left:14%;animation-delay:-6s}
  @keyframes float{
    0%,100%{transform:translateY(0) translateX(0)}
    33%{transform:translateY(-26px) translateX(12px)}
    66%{transform:translateY(16px) translateX(-14px)}
  }
  /* Voile de flou pour fondre les sphères derrière la carte */
  .scene::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(760px 620px at 50% 50%, rgba(6,10,16,.28), transparent 70%);
  }

  /* ---- Socle rond glassmorphism ---- */
  .login{width:560px;max-width:100%;position:relative;z-index:1}
  .login .glass{
    aspect-ratio:1;border-radius:50%;padding:0 92px;
    display:flex;flex-direction:column;justify-content:center;
    background:linear-gradient(155deg, rgba(24,34,46,.6), rgba(12,18,26,.48));
    backdrop-filter:blur(22px) saturate(150%);
    -webkit-backdrop-filter:blur(22px) saturate(150%);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:
      0 30px 80px rgba(0,0,0,.5),
      0 0 0 1px rgba(34,211,238,.06),
      inset 0 1px 0 rgba(255,255,255,.14),
      inset 0 -40px 80px rgba(6,58,71,.14);
    position:relative;overflow:hidden;
  }
  /* Léger éclat cyan en haut du socle */
  .login .glass::before{
    content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:radial-gradient(120% 70% at 50% -6%, rgba(103,232,249,.16), transparent 46%);
  }

  .login-brand{display:flex;flex-direction:column;align-items:center;gap:7px;margin-bottom:16px}
  .login-mark{width:62px;height:62px;display:flex;align-items:center;justify-content:center}
  .login-mark img{width:100%;height:100%;object-fit:contain}
  .login h1{
    font-size:2rem;letter-spacing:.14em;font-weight:800;
    background:linear-gradient(180deg,#ffffff, #b9e9f4 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 30px rgba(34,211,238,.2);
  }
  .login-sub{font-size:11.5px;color:var(--dim);letter-spacing:.16em;text-transform:uppercase}

  .login label{display:block;margin:12px 0 6px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.02em}

  /* Champs sur mesure pour l'effet verre */
  .login .field{position:relative}
  .login .field svg{
    position:absolute;left:15px;top:50%;transform:translateY(-50%);
    width:17px;height:17px;color:var(--muted);pointer-events:none;transition:color .2s;
  }
  .login input{
    width:100%;padding:12px 15px 12px 42px;
    background:rgba(9,14,20,.55);
    border:1px solid rgba(255,255,255,.10);
    border-radius:14px;color:var(--text);font-size:14px;font-family:var(--font);
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  .login input::placeholder{color:var(--muted)}
  .login input:focus{
    outline:none;background:rgba(9,14,20,.7);
    border-color:rgba(34,211,238,.55);
    box-shadow:0 0 0 4px rgba(34,211,238,.12), 0 0 24px rgba(34,211,238,.14);
  }
  .login .field:focus-within svg{color:var(--accent)}

  .err{min-height:16px;text-align:center;font-size:12.5px;color:var(--err);margin-top:10px;opacity:0;transition:opacity .2s}
  .err.show{opacity:1}
  .msg{min-height:14px;text-align:center;font-size:12.5px;color:var(--ok,#4ade80);margin-top:6px;opacity:0;transition:opacity .2s}
  .msg.show{opacity:1}

  .login .btn{
    width:100%;margin-top:16px;padding:13px;border:0;cursor:pointer;
    border-radius:14px;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.02em;
    color:#04252d;
    background:linear-gradient(180deg, #7ce9f6, #22d3ee 55%, #0aa9c9);
    box-shadow:0 12px 30px rgba(34,211,238,.32), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .12s ease, box-shadow .2s ease, filter .2s;
  }
  .login .btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 16px 40px rgba(34,211,238,.42), inset 0 1px 0 rgba(255,255,255,.5);filter:brightness(1.04)}
  .login .btn:active:not(:disabled){transform:translateY(0)}
  .login .btn:disabled{opacity:.7;cursor:default}

  .forgot{display:block;text-align:center;margin-top:12px;font-size:11.5px;color:var(--muted);background:none;border:0;width:100%}

  @media (max-width:600px){
    .login{width:100%}
    /* Sur petit écran : on relâche le cercle en carte arrondie pour ne rien rogner */
    .login .glass{aspect-ratio:auto;border-radius:34px;padding:36px 28px 30px}
    .login .glass::before{border-radius:34px}
    .login h1{font-size:1.8rem}
    .o1,.o5{width:150px;height:150px}
  }
  @media (prefers-reduced-motion:reduce){
    .orb{animation:none}
  }
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="orb o1"></div>
  <div class="orb teal o2"></div>
  <div class="orb o3"></div>
  <div class="orb teal o4"></div>
  <div class="orb o5"></div>
  <div class="orb teal o6"></div>
  <div class="orb o7"></div>
</div>
<div class="login">
  <div class="glass">
    <div class="login-brand">
      <div class="login-mark"><img src="assets/logo-plazma.png" alt="Logo ARCHI"></div>
      <h1>ARCHI</h1>
      <div class="login-sub">Espace staff · PlaZma Esport</div>
    </div>
    <label for="user">Nom d'utilisateur</label>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <input type="text" id="user" placeholder="ton pseudo" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
    </div>
    <label for="pw">Mot de passe</label>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <input type="password" id="pw" placeholder="••••••••" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')login()">
    </div>
    <div class="err" id="err"></div>
    <div class="msg" id="msg"></div>
    <button class="btn" id="btn" onclick="login()">Se connecter</button>
    <div class="forgot" style="cursor:default">Mot de passe oublié ? Contacte un administrateur.</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyAKwNEbNa6f40oSMwGp6dcDY1ZY6hUN1Ks',
  authDomain: 'plazma-esport.firebaseapp.com',
  projectId: 'plazma-esport',
  storageBucket: 'plazma-esport.firebasestorage.app',
  messagingSenderId: '534325929279',
  appId: '1:534325929279:web:b507a46c601fa6625edf8a'
};
// Domaine interne : le pseudo devient "<pseudo>@archi.local" pour Firebase.
// ⚠️ Doit rester identique à USER_DOMAIN dans plazma.js et plazma-admin.html.
const USER_DOMAIN = 'archi.local';
const normUser = u => u.trim().toLowerCase().replace(/[^a-z0-9._-]/g, '');
const toEmail = u => normUser(u) + '@' + USER_DOMAIN;

if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();

const $ = id => document.getElementById(id);
function showErr(t){ const e=$('err'); e.textContent=t; e.classList.add('show'); $('msg').classList.remove('show'); }
function clearMsg(){ $('err').classList.remove('show'); $('msg').classList.remove('show'); }

const FR_ERR = {
  'auth/user-disabled': 'Ce compte a été désactivé.',
  'auth/user-not-found': 'Aucun compte pour ce nom d\'utilisateur.',
  'auth/wrong-password': 'Nom d\'utilisateur ou mot de passe incorrect.',
  'auth/invalid-credential': 'Nom d\'utilisateur ou mot de passe incorrect.',
  'auth/too-many-requests': 'Trop de tentatives. Réessaie dans un instant.',
  'auth/network-request-failed': 'Problème de connexion réseau.'
};
const frError = e => FR_ERR[e && e.code] || (e && e.message) || 'Erreur de connexion.';

// Déjà connecté → on entre directement.
let redirecting = false;
auth.onAuthStateChanged(u => { if (u && !redirecting) { redirecting = true; location.replace('index.html'); } });

function login(){
  clearMsg();
  const user = $('user').value;
  const pw = $('pw').value;
  if (!normUser(user) || !pw){ showErr('Renseigne ton nom d\'utilisateur et ton mot de passe.'); return; }
  const btn = $('btn'); btn.disabled = true; btn.textContent = 'Connexion…';
  auth.signInWithEmailAndPassword(toEmail(user), pw)
    .then(() => { redirecting = true; location.replace('index.html'); })
    .catch(e => { showErr(frError(e)); btn.disabled = false; btn.textContent = 'Se connecter'; $('pw').value=''; $('pw').focus(); });
}
</script>
</body>
</html>
