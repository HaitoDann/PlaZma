<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/logo-plazma.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHI — Encyclopédie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css?v=20260831">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  .wk{display:grid;grid-template-columns:288px minmax(0,1fr) 210px;gap:0;max-width:1340px;margin:0 auto;
    min-height:calc(100vh - 54px)}
  .wk-backdrop{display:none}
  /* ---- Barre latérale ---- */
  .wk-side{border-right:1px solid var(--border);padding:20px 14px 40px;position:sticky;top:54px;
    align-self:start;height:calc(100vh - 54px);overflow-y:auto}
  .wk-side-head{padding:0 6px 12px}
  .wk-side-head h1{font-size:1.15rem;font-family:var(--font-display)}
  .wk-side-head p{font-size:12px;color:var(--muted);margin-top:2px}
  .wk-search{width:100%;margin:10px 0 6px}
  .wk-count{font-size:11px;color:var(--muted);padding:2px 6px 10px}
  .wk-cat{margin-top:6px}
  .wk-cat-h{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    background:none;border:0;cursor:pointer;color:var(--dim);
    font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:8px 6px;border-radius:8px;transition:color .15s,background .15s}
  .wk-cat-h:hover{color:var(--text);background:var(--surface-2)}
  .wk-cat-h .ic{font-size:14px}
  .wk-cat-h .n{flex:1}
  .wk-cat-h .c{font-size:10px;color:var(--muted);font-weight:600}
  .wk-cat-h .chev{transition:transform .18s;font-size:10px;color:var(--muted)}
  .wk-cat.collapsed .chev{transform:rotate(-90deg)}
  .wk-cat.collapsed .wk-links{display:none}
  .wk-sub{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);padding:8px 10px 3px}
  .wk-link{display:block;padding:6px 10px;border-radius:7px;font-size:13px;color:var(--dim);
    border-left:2px solid transparent;transition:color .12s,background .12s,border-color .12s;cursor:pointer}
  .wk-link:hover{color:var(--text);background:var(--surface-2)}
  .wk-link.active{color:var(--accent);background:var(--accent-soft);border-left-color:var(--accent)}
  .wk-link .stub{font-size:10px;color:var(--warn);margin-left:4px}
  .wk-noresult{font-size:12.5px;color:var(--muted);padding:12px 8px}

  /* ---- Contenu ---- */
  .wk-main{min-width:0;padding:28px 34px 90px}
  .wk-doc{max-width:760px}
  .wk-crumb{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .wk-crumb .ic{font-size:13px}
  .wk-meta{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12px;
    margin:2px 0 20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
  .wk-stub-banner{display:flex;align-items:center;gap:9px;background:color-mix(in srgb,var(--warn) 9%,transparent);
    border:1px solid color-mix(in srgb,var(--warn) 32%,transparent);border-radius:var(--r);
    padding:11px 14px;font-size:13px;color:var(--dim);margin-bottom:20px}

  /* ---- Rendu markdown ---- */
  .wk-doc h1{font-size:1.9rem;margin-bottom:4px}
  .wk-doc h2{font-size:1.3rem;font-family:var(--font-display);margin:30px 0 12px;padding-top:6px}
  .wk-doc h3{font-size:1.05rem;font-family:var(--font-display);color:var(--text);margin:22px 0 8px}
  .wk-doc h2::before{content:'';display:block;height:1px;background:var(--border);margin-bottom:16px}
  .wk-doc p{margin:11px 0;color:var(--dim)}
  .wk-doc strong{color:var(--text);font-weight:700}
  .wk-doc em{color:var(--dim)}
  .wk-doc ul,.wk-doc ol{margin:11px 0 11px 22px;color:var(--dim)}
  .wk-doc li{margin:5px 0}
  .wk-doc li::marker{color:var(--accent-2)}
  .wk-doc a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .12s}
  .wk-doc a:hover{border-bottom-color:var(--accent-line)}
  .wk-doc blockquote{border-left:3px solid var(--accent-line);background:var(--surface);
    padding:12px 16px;border-radius:0 var(--r) var(--r) 0;margin:16px 0;color:var(--dim)}
  .wk-doc blockquote p{margin:6px 0}
  .wk-doc hr{border:0;border-top:1px solid var(--border);margin:26px 0}
  .wk-doc code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-2);
    border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--accent)}
  .wk-doc pre{background:#0a0e13;border:1px solid var(--border);border-radius:var(--r);
    padding:16px;overflow-x:auto;margin:16px 0}
  .wk-doc pre code{background:none;border:0;padding:0;color:var(--dim);font-size:12.5px;line-height:1.5;white-space:pre}
  .wk-doc table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13.5px;display:block;overflow-x:auto}
  .wk-doc thead th{background:var(--surface-2);color:var(--text);font-weight:700;text-align:left;
    padding:9px 12px;border:1px solid var(--border);white-space:nowrap}
  .wk-doc tbody td{padding:9px 12px;border:1px solid var(--border);color:var(--dim);vertical-align:top}
  .wk-doc tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface) 55%,transparent)}
  .wk-doc .wl-missing{color:var(--muted);border-bottom:1px dotted var(--border-2);cursor:help}

  /* ---- Cartes de la page d'accueil ---- */
  .wl-card{display:inline-block;padding:7px 13px;border:1px solid var(--border);border-radius:999px;
    background:var(--surface);font-size:13px;color:var(--dim);text-decoration:none;
    transition:color .15s,border-color .15s,background .15s,transform .13s,box-shadow .15s;cursor:pointer}
  .wl-card:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);
    transform:translateY(-2px);box-shadow:0 4px 14px -5px color-mix(in srgb,var(--accent) 35%,transparent)}
  .wl-card:active{transform:translateY(0)}

  /* ---- Badges ---- */
  /* Version complète — header article uniquement */
  .wk-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;
    font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0;vertical-align:middle}
  .wk-badge.new{background:color-mix(in srgb,var(--accent) 12%,transparent);
    border:1px solid var(--accent-line);color:var(--accent)}
  .wk-badge.updated{background:color-mix(in srgb,var(--warn) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--warn)}
  .wk-badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
  /* Version point — sidebar */
  .wk-dot{display:inline-block;width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-left:5px;vertical-align:middle}
  .wk-dot.new{background:var(--accent)}
  .wk-dot.updated{background:var(--warn)}
  /* Version minuscule — cartes home */
  .wl-card .wk-dot{width:5px;height:5px;margin-left:4px;vertical-align:middle}
  /* date affichée dans le header article */
  .wk-date{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px}

  /* ---- Bouton retour accueil ---- */
  .wk-back{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--border);
    color:var(--muted);font-size:12px;font-weight:600;padding:5px 11px;border-radius:7px;cursor:pointer;
    font-family:var(--font);transition:color .15s,border-color .15s,background .15s;margin-bottom:12px}
  .wk-back:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}

  /* ---- Sommaire (rail droit) ---- */
  .wk-toc{position:sticky;top:74px;align-self:start;padding:28px 20px;width:210px;font-size:12.5px}
  .wk-toc-h{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .wk-toc a{display:block;padding:4px 0 4px 10px;color:var(--muted);border-left:2px solid var(--border);
    transition:color .12s,border-color .12s;line-height:1.35}
  .wk-toc a.sub{padding-left:22px;font-size:12px}
  .wk-toc a:hover{color:var(--dim)}
  .wk-toc a.active{color:var(--accent);border-left-color:var(--accent)}

  .wk-drawer-btn{display:none}

  @media(max-width:1180px){ .wk{grid-template-columns:264px minmax(0,1fr)} .wk-toc{display:none!important} }
  @media(max-width:820px){
    .wk{grid-template-columns:1fr}
    .wk-side{position:fixed;left:0;top:0;bottom:0;z-index:60;width:290px;height:100vh;
      background:var(--bg);border-right:1px solid var(--border);
      transform:translateX(-100%);transition:transform .25s ease;box-shadow:var(--shadow-3)}
    .wk.drawer-open .wk-side{transform:none}
    .wk-drawer-btn{display:inline-flex;align-items:center;gap:7px;margin-bottom:16px}
    .wk-main{padding:20px 18px 80px}
    .wk-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}
    .wk.drawer-open .wk-backdrop{display:block}
  }
</style>
</head>
<body>

<div class="loader"><div class="loader-inner"><div class="loader-ring-wrap"><div class="loader-arc1"></div><div class="loader-arc2"></div><img class="loader-logo" src="assets/logo-plazma.png" alt=""></div><div class="loader-mark">ARCHI</div></div></div>
<div id="nav"></div>

<div class="wk" id="wk">
  <div class="wk-backdrop" id="wkBackdrop"></div>
  <aside class="wk-side" id="wkSide">
    <div class="wk-side-head">
      <h1>Encyclopédie</h1>
      <p>Savoirs performance · micro · macro · hygiène de vie</p>
    </div>
    <input class="wk-search" id="wkSearch" type="text" placeholder="Rechercher…" autocomplete="off" spellcheck="false" data-ro-keep>
    <div class="wk-count" id="wkCount"></div>
    <nav id="wkTree"></nav>
  </aside>

  <main class="wk-main">
    <button class="btn btn-sm btn-ghost wk-drawer-btn" id="wkDrawerBtn">☰ Catégories</button>
    <article class="wk-doc" id="wkDoc"></article>
  </main>

  <aside class="wk-toc" id="wkToc"></aside>
</div>

<script src="assets/wiki-data.js?v=20260831"></script>
<script src="assets/plazma.js?v=20260831"></script>
<script>
'use strict';
PZ.mountNav('wikiperf', '#nav');

(function () {
  const W = window.PZ_WIKI;
  const treeEl = document.getElementById('wkTree');
  const docEl  = document.getElementById('wkDoc');
  const tocEl  = document.getElementById('wkToc');
  const searchEl = document.getElementById('wkCount') && document.getElementById('wkSearch');
  const countEl  = document.getElementById('wkCount');
  const wkEl   = document.getElementById('wk');

  if (!W || !W.articles || !W.articles.length) {
    docEl.innerHTML = '<h1>Encyclopédie indisponible</h1><p class="muted">Le fichier <code>assets/wiki-data.js</code> est manquant ou vide. Régénère-le avec <code>node scripts/build-wiki.js</code>.</p>';
    PZ.loadingDone();
    return;
  }

  const byId = {};
  W.articles.forEach(a => (byId[a.id] = a));

  // ---------- Barre latérale ----------
  function buildTree(filter) {
    const q = (filter || '').trim().toLowerCase();
    treeEl.innerHTML = '';
    let shown = 0;

    W.categories.forEach(cat => {
      const arts = W.articles.filter(a => a.cat === cat.id &&
        (!q || a.title.toLowerCase().includes(q) || a.text.includes(q)));
      if (!arts.length) return;
      shown += arts.length;

      const wrap = document.createElement('div');
      wrap.className = 'wk-cat';
      const head = document.createElement('button');
      head.className = 'wk-cat-h';
      head.innerHTML = `<span class="ic">${cat.icon}</span><span class="n">${esc(cat.name)}</span>`
        + `<span class="c">${arts.length}</span><span class="chev">▾</span>`;
      head.onclick = () => wrap.classList.toggle('collapsed');
      wrap.appendChild(head);

      const links = document.createElement('div');
      links.className = 'wk-links';
      let lastSub = null;
      arts.forEach(a => {
        if (a.sub && a.sub !== lastSub) {
          const s = document.createElement('div');
          s.className = 'wk-sub';
          s.textContent = a.sub;
          links.appendChild(s);
          lastSub = a.sub;
        }
        const l = document.createElement('a');
        l.className = 'wk-link';
        l.dataset.id = a.id;
        l.href = '#' + encodeURIComponent(a.id);
        const b = getBadge(a);
        l.innerHTML = esc(a.title)
          + (a.stub ? '<span class="stub">•</span>' : '')
          + dotHtml(a);
        links.appendChild(l);
      });
      wrap.appendChild(links);
      treeEl.appendChild(wrap);
    });

    if (!shown) treeEl.innerHTML = '<div class="wk-noresult">Aucun article ne correspond.</div>';
    countEl.textContent = q ? `${shown} résultat${shown > 1 ? 's' : ''}` : `${W.articles.length} articles · ${W.categories.length} catégories`;
    markActive();
  }

  function markActive() {
    const cur = currentId();
    treeEl.querySelectorAll('.wk-link').forEach(l =>
      l.classList.toggle('active', l.dataset.id === cur));
  }

  // ---------- Rendu d'un article ----------
  function render(id) {
    const a = byId[id];
    if (!a) { renderHome(); return; }
    const cat = W.categories.find(c => c.id === a.cat);
    const b = getBadge(a);
    const dateLabel = b
      ? `<span class="wk-date">${badgeHtml(a)}<span>${b.label === 'Mis à jour' ? 'Mis à jour le' : 'Publié le'} ${fmtDate(b.date)}</span></span>`
      : (a.date ? `<span class="wk-date"><span>Publié le ${fmtDate(a.date)}</span></span>` : '');
    let head = `<button class="wk-back" onclick="location.hash=''">← Accueil</button>`
      + `<div class="wk-crumb"><span class="ic">${cat ? cat.icon : ''}</span>${esc(a.catName)}${a.sub ? ' · ' + esc(a.sub) : ''}</div>`;
    let meta = `<div class="wk-meta">${dateLabel}<span>${a.words} mots</span><span>~${Math.max(1, Math.round(a.words / 200))} min de lecture</span></div>`;
    let banner = a.stub ? '<div class="wk-stub-banner">🚧 Note en cours de rédaction — contenu à compléter.</div>' : '';
    docEl.innerHTML = head + banner + a.html + meta;
    addHeadingIds();
    buildToc();
    wireInternalLinks();
    docEl.parentElement.scrollTop = 0;
    window.scrollTo({ top: 0, behavior: 'auto' });
    markActive();
    document.title = 'ARCHI — ' + a.title;
  }

  function renderHome() {
    const cards = W.categories.map(c => {
      const arts = W.articles.filter(a => a.cat === c.id);
      const links = arts.slice(0, 6).map(a =>
        `<a class="wl wl-card" href="#${encodeURIComponent(a.id)}" data-id="${escAttr(a.id)}">${esc(a.title)}${dotHtml(a)}</a>`).join('');
      return `<section style="margin-bottom:26px">
        <h2 style="font-size:1.15rem">${c.icon} ${esc(c.name)} <span style="color:var(--muted);font-size:13px;font-weight:400">· ${arts.length}</span></h2>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">${links}</div>
      </section>`;
    }).join('');
    docEl.innerHTML = `<div class="wk-crumb"><span class="ic">📚</span>Accueil</div>
      <h1 style="margin-bottom:6px">Encyclopédie ARCHI</h1>
      <p class="muted" style="margin-bottom:26px">${W.articles.length} articles répartis en ${W.categories.length} catégories. Cherche un sujet ou choisis une note.</p>
      ${cards}`;
    tocEl.innerHTML = '';
    wireInternalLinks();
    docEl.querySelectorAll('.wl').forEach(styleCardLink);
    markActive();
    document.title = 'ARCHI — Encyclopédie';
  }
  function styleCardLink(el) { el.classList.add('wl-card'); }

  // Ancres sur les titres pour le sommaire
  function addHeadingIds() {
    let n = 0;
    docEl.querySelectorAll('h2, h3').forEach(h => {
      if (!h.id) h.id = 'h_' + (n++) + '_' + slug(h.textContent);
    });
  }
  function buildToc() {
    const heads = [...docEl.querySelectorAll('h2, h3')];
    if (heads.length < 2) { tocEl.innerHTML = ''; return; }
    tocEl.innerHTML = '<div class="wk-toc-h">Sur cette page</div>' +
      heads.map(h => `<a href="#${h.id}" class="${h.tagName === 'H3' ? 'sub' : ''}" data-h="${h.id}">${esc(h.textContent)}</a>`).join('');
    tocEl.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        const t = document.getElementById(link.dataset.h);
        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  // Liens internes (wikilinks) -> navigation par hash
  function wireInternalLinks() {
    docEl.querySelectorAll('a.wl[data-id]').forEach(l => {
      l.addEventListener('click', e => {
        e.preventDefault();
        go(l.dataset.id);
      });
    });
  }

  // ---------- Routage par hash ----------
  function currentId() {
    const h = location.hash.replace(/^#/, '');
    if (!h) return null;
    try { return decodeURIComponent(h); } catch (e) { return h; }
  }
  function go(id) {
    if (byId[id]) location.hash = '#' + encodeURIComponent(id);
    else location.hash = '';
    closeDrawer();
  }
  function route() {
    const id = currentId();
    if (id && byId[id]) render(id);
    else renderHome();
  }
  window.addEventListener('hashchange', route);

  // ---------- Recherche ----------
  let searchTimer;
  document.getElementById('wkSearch').addEventListener('input', e => {
    clearTimeout(searchTimer);
    const v = e.target.value;
    searchTimer = setTimeout(() => buildTree(v), 120);
  });

  // ---------- Tiroir mobile ----------
  function closeDrawer() { wkEl.classList.remove('drawer-open'); }
  document.getElementById('wkDrawerBtn').addEventListener('click', () => wkEl.classList.toggle('drawer-open'));
  document.getElementById('wkBackdrop').addEventListener('click', closeDrawer);

  // Sommaire : surlignage de la section en cours au défilement
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const links = tocEl.querySelectorAll('a'); if (!links.length) return;
      let curr = null;
      docEl.querySelectorAll('h2, h3').forEach(h => {
        if (h.getBoundingClientRect().top < 120) curr = h.id;
      });
      links.forEach(l => l.classList.toggle('active', l.dataset.h === curr));
    });
  }, { passive: true });

  // ---------- Utilitaires ----------
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }
  function slug(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').slice(0, 40); }

  // ---------- Badges ----------
  const DAY_MS = 86400000;
  const BADGE_THRESH = 14 * DAY_MS;
  function getBadge(a) {
    const now = Date.now();
    const upd = a.updated ? Date.parse(a.updated) : 0;
    const cre = a.date    ? Date.parse(a.date)    : 0;
    if (upd && (now - upd) < BADGE_THRESH) return { label: 'Mis à jour', cls: 'updated', date: a.updated };
    if (cre && (now - cre) < BADGE_THRESH) return { label: 'Nouveau',    cls: 'new',     date: a.date };
    return null;
  }
  function badgeHtml(a) {
    const b = getBadge(a); if (!b) return '';
    return `<span class="wk-badge ${b.cls}"><span class="wk-badge-dot"></span>${b.label}</span>`;
  }
  function dotHtml(a) {
    const b = getBadge(a); if (!b) return '';
    return `<span class="wk-dot ${b.cls}" title="${b.label}"></span>`;
  }
  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
  }

  // ---------- Démarrage ----------
  buildTree('');
  route();
  PZ.loadingDone();
})();
</script>
</body>
</html>
