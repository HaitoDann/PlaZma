<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/logo-plazma.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHI — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css?v=20260923pro">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  .content{max-width:1180px;margin:0 auto;padding:22px var(--gut) 80px;display:flex;flex-direction:column;gap:18px}
  .dash-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .dash-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .evt{font-size:13px;color:var(--muted);margin-top:4px}
  .evt b{color:var(--text);font-weight:600}

  /* Aujourd'hui */
  .today{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;
    display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:20px;align-items:stretch}
  .today-hero{display:flex;flex-direction:column;justify-content:center;gap:6px}
  .today-eyebrow{font-size:12px;color:var(--muted)}
  .today-main{font-size:1.45rem;font-weight:600;line-height:1.15}
  .today-sub{font-size:13px;color:var(--muted)}
  .today-sub b{color:var(--dim);font-weight:600}
  .today-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .ttile{background:var(--surface-2);border-radius:var(--r);padding:12px 14px;display:block;color:inherit}
  a.ttile:hover{background:var(--elevated)}
  .ttile-lbl{font-size:12px;color:var(--muted);margin-bottom:6px}
  .ttile-val{font-family:var(--font-mono);font-size:1.3rem;font-weight:500;line-height:1.1}
  .ttile-val.sm{font-family:var(--font);font-size:1rem;font-weight:600}
  .ttile-sub{font-size:12px;color:var(--muted);margin-top:4px}
  @media(max-width:820px){.today{grid-template-columns:1fr}}
  @media(max-width:480px){.today-tiles{grid-template-columns:1fr}}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .panel-h .card-title{font-size:1rem}
  .panel-sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
  .plink{font-size:12.5px;font-weight:500;color:var(--accent);cursor:pointer}
  .plink:hover{text-decoration:underline}
  .empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}
  .empty a{color:var(--accent);cursor:pointer}

  /* Cette semaine : une ligne par session */
  .wk-list{display:flex;flex-direction:column}
  .wk-row{display:grid;grid-template-columns:110px 70px 1fr auto;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--border);font-size:13px}
  .wk-row:last-child{border-bottom:0}
  .wk-row.past{color:var(--muted)}
  .wk-day{font-weight:600}
  .wk-row.past .wk-day{font-weight:500}
  .wk-time{font-family:var(--font-mono);color:var(--dim)}
  .wk-type{display:flex;align-items:center;gap:8px;min-width:0}
  .wk-type i{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--wc)}
  .wk-type span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wk-cr{font-size:12px;white-space:nowrap}
  .wk-cr a{color:var(--accent)}
  .wk-cr.todo a{color:var(--warn)}
  .wk-cr.ok{color:var(--dim)}
  .wk-foot{margin-top:10px;font-size:12.5px;color:var(--muted)}
  @media(max-width:560px){.wk-row{grid-template-columns:80px 1fr auto}.wk-time{display:none}}

  /* Performance (calculée) */
  .perf{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .pt{background:var(--surface-2);border-radius:var(--r);padding:12px 14px}
  .pt-lbl{font-size:12px;color:var(--muted)}
  .pt-val{font-family:var(--font-mono);font-size:1.5rem;font-weight:500;line-height:1.1;margin-top:6px}
  .pt-sub{font-size:12px;color:var(--muted);margin-top:4px}
  .ok-t{color:var(--ok)}.err-t{color:var(--err)}.warn-t{color:var(--warn)}
  .perf-extra{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .mini-h{font-size:12px;color:var(--muted);margin-bottom:8px}
  .bars{display:flex;flex-direction:column;gap:6px}
  .bar-row{display:grid;grid-template-columns:34px 1fr 64px;gap:10px;align-items:center;font-size:12.5px}
  .bar-row .lab{font-family:var(--font-mono);color:var(--dim)}
  .bar-track{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
  .bar-fill{height:100%;background:var(--accent);border-radius:3px}
  .bar-row .v{font-family:var(--font-mono);text-align:right;color:var(--dim)}
  .err-list{display:flex;flex-direction:column;gap:6px;font-size:13px}
  .err-list div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
  .err-list div:last-child{border-bottom:0}
  .err-list span{color:var(--muted);font-family:var(--font-mono);font-size:12px}
  @media(max-width:900px){.perf{grid-template-columns:repeat(2,1fr)}.perf-extra,.grid2{grid-template-columns:1fr}}

  /* Résultats */
  .forme{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .forme-lbl{font-size:12px;color:var(--muted);margin-right:6px}
  .wl-dot{width:18px;height:18px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff}
  .mtable{width:100%;border-collapse:collapse;font-size:13px}
  .mtable th{text-align:left;font-size:11.5px;font-weight:500;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--border)}
  .mtable td{padding:8px;border-bottom:1px solid var(--border)}
  .mtable tr[data-row]{cursor:pointer}
  .mtable tr[data-row]:hover td{background:var(--surface-2)}
  .mres{font-weight:600;font-size:12px}
  .mres.W{color:var(--ok)}.mres.L{color:var(--err)}.mres.D{color:var(--muted)}
  .mtype{font-size:11px;color:var(--muted)}

  /* Objectifs */
  .objs{display:flex;flex-direction:column;gap:8px}
  .obj{background:var(--surface-2);border-radius:var(--r);padding:11px 13px;cursor:pointer}
  .obj:hover{background:var(--elevated)}
  .obj-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
  .obj-name{font-weight:500;font-size:13.5px}
  .obj-badges{display:flex;gap:6px;flex-shrink:0}
  .obj-bar{display:flex;align-items:center;gap:10px}
  .obj-track{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
  .obj-fill{height:100%;border-radius:3px}
  .obj-pct{font-family:var(--font-mono);font-size:12px;min-width:36px;text-align:right;color:var(--dim)}
  .obj-dl{font-size:11.5px;color:var(--muted);margin-top:6px}

  /* Roster */
  .rlist{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .rrow{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:var(--r);padding:10px 12px;min-width:0}
  .rrow-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .rrow-main{flex:1;min-width:0}
  .rrow-name{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rrow-role{font-size:12px;color:var(--muted)}
  .rrow a{font-size:12px;color:var(--accent);white-space:nowrap}
  .rrow .off{font-size:12px;color:var(--muted)}
  @media(max-width:900px){.rlist{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:480px){.rlist{grid-template-columns:1fr}}

  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .rcr{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
  .rcr:last-child{border-bottom:none}
  .field{margin-bottom:11px}
  @media(max-width:900px){.settings-grid{grid-template-columns:1fr}}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--elevated);border:1px solid var(--border-2);
    border-radius:var(--r);padding:10px 16px;font-size:13px;font-weight:500;z-index:500;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>

<div class="loader"><div class="loader-inner"><div class="loader-ring-wrap"><div class="loader-arc1"></div><div class="loader-arc2"></div><img class="loader-logo" src="assets/logo-plazma.png" alt=""></div><div class="loader-mark">ARCHI</div></div></div>
<div id="nav"></div>

<div class="content">
  <div class="dash-top">
    <div>
      <div class="eyebrow" id="dateSub">—</div>
      <h1>Dashboard</h1>
      <div class="evt" id="evtLine"></div>
    </div>
    <div class="dash-actions">
      <span class="sync-pill"><span class="sync-dot offline" id="syncDot"></span><span id="syncText">En attente…</span><span class="sync-time" id="syncTime"></span></span>
      <button class="btn btn-sm" id="btnRefresh" title="Recharger les données"><svg class="ib ib-refresh" viewBox="0 0 24 24"><g class="rf-arrows"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></g><polyline class="rf-check" points="7 12.5 10.5 16 17 8.5"/></svg> Actualiser</button>
      <button class="btn btn-sm btn-primary" onclick="openAddOffi()" data-edit><svg class="ib ib-plus" viewBox="0 0 24 24"><g class="pl-pen"><path class="pl-pen-body" d="M14.5 4.5l5 5L9 20l-5.5 1L5 15.5z"/><path class="pl-pen-nib" d="M12.5 6.5l5 5"/></g><path class="pl-pen-line" d="M4 21.5h15"/></svg> Match officiel</button>
    </div>
  </div>

  <div class="today" id="todayPanel"></div>

  <!-- CETTE SEMAINE : sessions du Planning + état des CR -->
  <div class="panel">
    <div class="panel-h">
      <div class="card-title">Cette semaine <span class="panel-sub" id="wkSub"></span></div>
      <a class="plink" href="plazma-schedule.html">Planning →</a>
    </div>
    <div id="weekBox"></div>
  </div>

  <!-- PERFORMANCE : calculée depuis les CR de scrim et le Planning -->
  <div class="panel">
    <div class="panel-h">
      <div class="card-title">Performance <span class="panel-sub">calculée depuis les CR et le Planning</span></div>
      <a class="plink" href="plazma-scrim.html">CR de scrim →</a>
    </div>
    <div id="perfBox"></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <div class="panel-h"><div class="card-title">Résultats récents</div></div>
      <div id="resultsBox"></div>
    </div>
    <div class="panel">
      <div class="panel-h">
        <div class="card-title">Objectifs de la saison</div>
        <button class="btn btn-sm" onclick="openAddObj()" data-edit><svg class="ib ib-plus" viewBox="0 0 24 24"><g class="pl-pen"><path class="pl-pen-body" d="M14.5 4.5l5 5L9 20l-5.5 1L5 15.5z"/><path class="pl-pen-nib" d="M12.5 6.5l5 5"/></g><path class="pl-pen-line" d="M4 21.5h15"/></svg> Ajouter</button>
      </div>
      <div class="objs" id="objList"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-h"><div class="card-title">Roster</div></div>
    <div class="rlist" id="roster"></div>
  </div>

  <details class="panel" id="settings">
    <summary style="cursor:pointer;font-weight:600">Paramètres</summary>
    <div class="settings-grid" style="margin-top:14px">
      <div>
        <div class="eyebrow" style="margin-bottom:10px">Prochain événement</div>
        <div class="field"><label>Nom</label><input type="text" id="p_nextEvent" placeholder="ex : Nexus Tour Phase 1"></div>
        <div class="field-row">
          <div class="field"><label>Date</label><input type="date" id="p_nextEventDate"></div>
          <div class="field"><label>Objectif</label><input type="text" id="p_goal" placeholder="ex : Top 4"></div>
        </div>

      <div>
        <div class="eyebrow" style="margin-bottom:10px">Comptes op.gg (format Pseudo-TAG)</div>

    <div style="text-align:right;margin-top:12px"><button class="btn btn-sm btn-primary" onclick="saveSettings()" data-edit><svg class="ib ib-save" viewBox="0 0 24 24"><g class="sv-disk"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></g><polyline class="sv-check" points="7 12.5 10.5 16 17 8.5"/></svg> Enregistrer</button></div>
  </details>
</div>

<!-- MODAL MATCH OFFICIEL -->
<div class="overlay" id="ovMatch">
  <div class="modal">
    <div class="modal-title" id="mTitle">Ajouter un match officiel</div>
    <div class="field-row">
      <div class="field"><label>Adversaire *</label><input type="text" id="mOpp" placeholder="Nom de l'équipe"></div>
      <div class="field"><label>Date</label><input type="date" id="mDate"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Résultat</label><select id="mRes"><option value="W">Victoire</option><option value="L">Défaite</option><option value="D">Nul</option></select></div>
      <div class="field"><label>Score (ex : 2-1)</label><input type="text" id="mScore" placeholder="—"></div>
    </div>
    <div class="field"><label>Note</label><textarea id="mNote" rows="2" placeholder="Compétition, faits marquants…"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="mDel" style="display:none;flex:0" onclick="deleteOffi()"><svg class="ib ib-trash" viewBox="0 0 24 24"><g class="tr-can"><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></g><g class="tr-lid"><polyline points="3 6 5 6 21 6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></g><circle class="tr-item" cx="12" cy="2" r="1.7" fill="currentColor" stroke="none"/></svg> Supprimer</button>

      <button class="btn btn-primary" id="mConf"><svg class="ib ib-plus" viewBox="0 0 24 24"><g class="pl-pen"><path class="pl-pen-body" d="M14.5 4.5l5 5L9 20l-5.5 1L5 15.5z"/><path class="pl-pen-nib" d="M12.5 6.5l5 5"/></g><path class="pl-pen-line" d="M4 21.5h15"/></svg> Ajouter</button>
    </div>
  </div>
</div>

<!-- MODAL OBJECTIF -->
<div class="overlay" id="ovObj">
  <div class="modal">
    <div class="modal-title" id="oTitle">Ajouter un objectif</div>
    <div class="field"><label>Objectif *</label><input type="text" id="oName" placeholder="ex : Atteindre 8.5 CS/min"></div>
    <div class="field-row">
      <div class="field"><label>Priorité</label><select id="oPrio"><option value="high">Urgent</option><option value="medium">Normal</option><option value="low">Faible</option></select></div>
      <div class="field"><label>Statut</label><select id="oStatus"><option value="todo">À faire</option><option value="progress">En cours</option><option value="done">Terminé</option></select></div>
    </div>

      <div class="field"><label>Progression (%)</label><input type="number" id="oPct" placeholder="0" min="0" max="100"></div>
      <div class="field"><label>Échéance</label><input type="date" id="oDl"></div>

      <button class="btn btn-danger" id="oDel" style="display:none;flex:0" onclick="deleteObj()"><svg class="ib ib-trash" viewBox="0 0 24 24"><g class="tr-can"><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></g><g class="tr-lid"><polyline points="3 6 5 6 21 6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></g><circle class="tr-item" cx="12" cy="2" r="1.7" fill="currentColor" stroke="none"/></svg> Supprimer</button>
      <button class="btn btn-ghost" onclick="closeModals()">Annuler</button>
      <button class="btn btn-primary" id="oConf"><svg class="ib ib-plus" viewBox="0 0 24 24"><g class="pl-pen"><path class="pl-pen-body" d="M14.5 4.5l5 5L9 20l-5.5 1L5 15.5z"/><path class="pl-pen-nib" d="M12.5 6.5l5 5"/></g><path class="pl-pen-line" d="M4 21.5h15"/></svg> Ajouter</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/plazma.js?v=20260923pro" data-section="dashboard"></script>
<script>
'use strict';
PZ.mountNav('dashboard', '#nav');
let _editId = null;

const DAYS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const PTYPES = {
  scrim:{l:'Scrim',c:'#3b82f6'}, soloq:{l:'SoloQ',c:'#ef4444'}, repos:{l:'Repos',c:'#22c55e'},
  match:{l:'Match officiel',c:'#f97316'}, coaching:{l:'Coaching',c:'#ec4899'}, review:{l:'Review VOD',c:'#a855f7'},
  flexq:{l:'FlexQ',c:'#f59e0b'}, atelier:{l:'Atelier',c:'#2dd4bf'}, autre:{l:'Autre',c:'#94a3b8'},
};

// Doc « dashboard » : événement, objectifs, officiels, comptes op.gg.
// (Les anciens champs de rang SoloQ saisis à la main sont conservés tels quels mais plus affichés.)
let state = { nextEvent:'', nextEventDate:'', goal:'', roster:[], objectives:[], officials:[] };
// Données agrégées (lues ailleurs, jamais stockées ici)
let agg = null;   // null = chargement ; sinon { stats, week, weekDenied, avail, scoutLatest, scoutDenied }

// ── Helpers date ──
const _now = () => new Date();
const todayIso = () => { const d=_now(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function getWeekNum(d){ d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day); const y1=new Date(Date.UTC(d.getUTCFullYear(),0,1)); return Math.ceil((((d-y1)/86400000)+1)/7); }
function currentWeekValue(){ return PZ.stats.isoWeek(_now()); }
const parseHM = t => (/^\d{1,2}:\d{2}$/.test(t||'') ? (+t.split(':')[0])*60 + (+t.split(':')[1]) : null);
function slotDurMin(s){ const a=parseHM(s.start), b=parseHM(s.end); if(a==null||b==null) return null; let d=b-a; if(d<0) d+=1440; return d; }
function fmtDur(min){ if(!min||min<=0) return ''; const h=Math.floor(min/60), m=min%60; return h ? (m?`${h}h${String(m).padStart(2,'0')}`:`${h}h`) : `${m}min`; }
const fmtDay = ds => ds ? new Date(ds+'T12:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}) : '—';

// ── Résultats (CR de scrim + officiels) ──
const crs = () => (agg && agg.stats && agg.stats.crs) || [];
function scrimRows(){ return crs().map(s=>({id:s.id, date:s.m_date||'', opp:s.m_adv||'—', score:(s.s_plazma||'0')+'–'+(s.s_adv||'0'), result:PZ.stats.scrimResult(s), type:'Scrim'})).filter(r=>r.result); }
function offiRows(){ return (state.officials||[]).map(o=>({id:o.id, date:o.date||'', opp:o.opp||'—', score:o.score||'—', result:o.result, type:'Officiel'})); }
function allRows(){ return [...scrimRows(), ...offiRows()].sort((a,b)=>(a.date>b.date?-1:a.date<b.date?1:0)); }
function record(rows){ const w=rows.filter(r=>r.result==='W').length, l=rows.filter(r=>r.result==='L').length, d=rows.filter(r=>r.result==='D').length; const t=w+l; return {w,l,d,total:t,wr:t?Math.round(w/t*100):null}; }

// ── Sessions de la semaine, avec le CR rattaché ──
function weekSessions(){
  const wk=(agg&&agg.week)||{}; const w=currentWeekValue(); const now=_now();
  const links = PZ.stats.linkWeek(w, wk, crs());
  const out=[];
  DAYS.forEach((day,di)=>(wk[day]||[]).forEach((s,idx)=>{
    const date=PZ.stats.slotDate(w,day); const hm=parseHM(s.start);
    const dt=new Date(date+'T00:00'); if(hm!=null) dt.setHours(Math.floor(hm/60),hm%60,0,0); else dt.setHours(23,59,0,0);
    out.push({day,di,idx,slot:s,date,dt,past:dt<now,cr:links[s.id||(day+'#'+idx)]||null});
  }));
  return out.sort((a,b)=>a.dt-b.dt);
}
function nextSession(){ return weekSessions().find(x=>!x.past) || null; }

// ── RENDER ──
function render(){ renderHeader(); renderToday(); renderWeek(); renderPerf(); renderResults(); renderObjectives(); renderRoster(); renderSettingsForm(); }

function renderHeader(){
  const el=document.getElementById('evtLine');
  if(!state.nextEvent){ el.innerHTML=''; return; }
  const days=state.nextEventDate?Math.ceil((new Date(state.nextEventDate+'T12:00')-_now())/86400000):null;
  el.innerHTML=`Prochain événement : <b>${esc(state.nextEvent)}</b>${state.nextEventDate?' · '+fmtDay(state.nextEventDate):''}${days!=null&&days>=0?' · J-'+days:''}${state.goal?' · objectif '+esc(state.goal):''}`;
}

function topObjective(){
  const order={high:0,medium:1,low:2};
  return [...(state.objectives||[])].filter(o=>o.status!=='done').sort((a,b)=>(order[a.priority??'medium'])-(order[b.priority??'medium']))[0] || null;
}
function renderToday(){
  const el=document.getElementById('todayPanel');
  if(!agg){ el.innerHTML='<div class="empty" style="grid-column:1/-1">Chargement…</div>'; return; }
  const nx=agg.weekDenied?null:nextSession();
  const sc=record(scrimRows());
  const opp=(agg.scoutLatest && (agg.scoutLatest.m_team||'').trim())?agg.scoutLatest:null;
  const obj=topObjective();
  const prob=agg.stats.topErrors[0]||null;
  const rSize=agg.rosterSize||5;
  let heroMain, heroSub;
  if(nx){ const t=(PTYPES[nx.slot.type]||PTYPES.autre);
    heroMain=`${t.l} · ${nx.day}`;
    heroSub=`${nx.slot.start?'<b>'+esc(nx.slot.start)+'</b> · ':''}${nx.slot.note?esc(nx.slot.note):(opp&&nx.slot.type==='scrim'?'vs '+esc(opp.m_team):'Créneau prévu')}`;
    if(PZ.stats.isLinkable(nx.slot)) heroSub+=` · <a class="plink" href="${crHref(nx)}">${nx.cr?'Ouvrir le CR':'Préparer le CR'}</a>`;
  } else { heroMain='Rien de prévu'; heroSub=agg.weekDenied?'Accès Planning requis':'Aucune session à venir cette semaine'; }
  let dispoVal='—', dispoSub='prochain créneau', dispoColor='';
  if(nx){ const n=(agg.avail||{})[nx.day]||0; dispoVal=n+'/'+rSize; dispoColor=n>=rSize?'ok-t':n>=rSize-1?'warn-t':'err-t';
    dispoSub=n>=rSize?'effectif complet':(rSize-n)+' manquant'+((rSize-n)>1?'s':''); }
  el.innerHTML=`
    <div class="today-hero">
      <span class="today-eyebrow">Prochain rendez-vous</span>
      <div class="today-main">${esc(heroMain)}</div>
      <div class="today-sub">${heroSub}</div>
    </div>
    <div class="today-tiles">
      <a class="ttile" href="plazma-schedule.html"><div class="ttile-lbl">Disponibles</div>
        <div class="ttile-val ${dispoColor}">${dispoVal}</div><div class="ttile-sub">${dispoSub}</div></a>
      <div class="ttile"><div class="ttile-lbl">Forme scrims</div>
        <div class="ttile-val ${sc.wr==null?'':sc.wr>=50?'ok-t':'err-t'}">${sc.total?sc.w+'V – '+sc.l+'D':'—'}</div><div class="ttile-sub">${sc.total?(sc.wr+'% de victoires'):'aucun scrim'}</div></div>
      <a class="ttile" href="plazma-scouting.html"><div class="ttile-lbl">Adversaire</div>
        <div class="ttile-val sm">${opp?esc(opp.m_team):'—'}</div><div class="ttile-sub">${opp?({low:'menace faible',med:'menace moyenne',high:'menace élevée'}[opp.threatLevel]||'fiche de scouting'):'aucune fiche'}</div></a>
      <div class="ttile"><div class="ttile-lbl">Point à travailler</div>
        <div class="ttile-val sm">${prob?esc(prob[0]):(obj?esc(obj.name):'—')}</div><div class="ttile-sub">${prob?'erreur la plus fréquente':(obj?'objectif prioritaire':'pas encore de données')}</div></div>
    </div>`;
}

function crHref(x){
  if(x.cr) return 'plazma-scrim.html#'+encodeURIComponent(x.cr.id);
  const q=new URLSearchParams({date:x.date, adv:x.slot.note||'', week:currentWeekValue()});
  if(x.slot.id) q.set('slot', x.slot.id);
  return 'plazma-scrim.html#new?'+q.toString();
}
function renderWeek(){
  const el=document.getElementById('weekBox'), sub=document.getElementById('wkSub');
  if(!agg){ el.innerHTML='<div class="empty">Chargement…</div>'; sub.textContent=''; return; }
  if(agg.weekDenied){ el.innerHTML='<div class="empty">Accès Planning requis pour ce module.</div>'; sub.textContent=''; return; }
  const list=weekSessions();
  if(!list.length){ sub.textContent=''; el.innerHTML='<div class="empty">Aucune session planifiée cette semaine. <a href="plazma-schedule.html">Ouvrir le Planning →</a></div>'; return; }
  const total=list.reduce((m,x)=>m+(slotDurMin(x.slot)||0),0);
  sub.textContent=list.length+' session'+(list.length>1?'s':'')+(total?' · '+fmtDur(total):'');
  const canCR=PZ.stats.canSeeScrims();
  el.innerHTML='<div class="wk-list">'+list.map(x=>{
    const t=PTYPES[x.slot.type]||PTYPES.autre;
    let cr='';
    if(canCR && PZ.stats.isLinkable(x.slot)){
      if(x.cr){ const r=PZ.stats.scrimResult(x.cr);
        cr=`<span class="wk-cr ok"><a href="${crHref(x)}">CR${r?' · '+esc((x.cr.s_plazma||0)+'–'+(x.cr.s_adv||0)):' en cours'}</a></span>`; }
      else cr=`<span class="wk-cr${x.past?' todo':''}"><a href="${crHref(x)}">${x.past?'CR à remplir':'Préparer le CR'}</a></span>`;
    }
    return `<div class="wk-row${x.past?' past':''}">
      <span class="wk-day">${x.day}</span>
      <span class="wk-time">${esc(x.slot.start||'—')}</span>
      <span class="wk-type" style="--wc:${t.c}"><i></i><span>${t.l}${x.slot.note?' · '+esc(x.slot.note):''}</span></span>
      ${cr||'<span></span>'}
    </div>`;
  }).join('')+'</div>';
}

function renderPerf(){
  const el=document.getElementById('perfBox');
  if(!agg){ el.innerHTML='<div class="empty">Chargement…</div>'; return; }
  const st=agg.stats;
  if(!st.canScrim){ el.innerHTML='<div class="empty">Accès aux CR de scrim requis pour les statistiques.</div>'; return; }
  const off=record(offiRows());
  const cls=v=>v==null?'':v>=50?'ok-t':'err-t';
  const cov=st.coverage;
  const covPct=cov.planned?Math.round(cov.withCr/cov.planned*100):null;
  let html=`<div class="perf">
    <div class="pt"><div class="pt-lbl">Winrate scrims</div><div class="pt-val ${cls(st.scrims.wr)}">${st.scrims.wr==null?'—':st.scrims.wr+'%'}</div><div class="pt-sub">${st.scrims.w}V · ${st.scrims.l}D · ${st.crs.length} CR</div></div>
    <div class="pt"><div class="pt-lbl">Games gagnées</div><div class="pt-val ${cls(st.games.wr)}">${st.games.total?st.games.w+'/'+st.games.total:'—'}</div><div class="pt-sub">${st.games.wr==null?'aucune game notée':st.games.wr+'% des games'}</div></div>
    <div class="pt"><div class="pt-lbl">Officiels</div><div class="pt-val">${off.total?off.w+'–'+off.l:'—'}</div><div class="pt-sub">${off.total?off.wr+'% de victoires':'aucun match officiel'}</div></div>
    <div class="pt"><div class="pt-lbl">CR remplis · 4 sem.</div><div class="pt-val ${covPct==null?'':covPct>=80?'ok-t':covPct>=50?'warn-t':'err-t'}">${st.canPlan?(cov.planned?cov.withCr+'/'+cov.planned:'—'):'—'}</div><div class="pt-sub">${!st.canPlan?'accès Planning requis':st.presence.rate==null?'scrims planifiés passés':'présence '+st.presence.rate+'%'}</div></div>
  </div>`;
  // Détail : winrate par game + erreurs récurrentes + CR manquants
  const games=Object.keys(st.perGame).sort();
  const bars=games.length?'<div class="bars">'+games.map(g=>{ const p=st.perGame[g], t=p.w+p.l, pct=t?Math.round(p.w/t*100):0;
    return `<div class="bar-row"><span class="lab">G${g}</span><span class="bar-track"><span class="bar-fill" style="display:block;width:${pct}%"></span></span><span class="v">${p.w}/${t}</span></div>`; }).join('')+'</div>'
    :'<div class="empty" style="padding:10px;text-align:left">Renseigne le résultat de chaque game dans les CR.</div>';
  const errs=st.topErrors.length?'<div class="err-list">'+st.topErrors.map(([c,n])=>`<div>${esc(c)}<span>poids ${n}</span></div>`).join('')+'</div>'
    :'<div class="empty" style="padding:10px;text-align:left">Aucune erreur relevée dans les CR.</div>';
  html+=`<div class="perf-extra"><div><div class="mini-h">Victoires par game</div>${bars}</div><div><div class="mini-h">Erreurs récurrentes</div>${errs}</div></div>`;
  if(st.canPlan && cov.missing.length){
    html+=`<div class="wk-foot">CR manquants : ${cov.missing.slice(-5).reverse().map(m=>{
      const q=new URLSearchParams({date:m.date, adv:m.slot.note||'', week:m.week}); if(m.slot.id) q.set('slot',m.slot.id);
      return `<a class="plink" href="plazma-scrim.html#new?${q.toString()}">${m.day.slice(0,3)}. ${fmtDay(m.date)}${m.slot.note?' · '+esc(m.slot.note):''}</a>`; }).join(' · ')}</div>`;
  }
  el.innerHTML=html;
}

function renderResults(){
  const el=document.getElementById('resultsBox');
  if(!agg){ el.innerHTML='<div class="empty">Chargement…</div>'; return; }
  const rows=allRows();
  if(!rows.length){ el.innerHTML='<div class="empty">Aucun résultat. Les scrims viennent des <a href="plazma-scrim.html">CR</a>, les officiels du bouton « Match officiel ».</div>'; return; }
  const forme=rows.slice(0,10);
  let html=`<div class="forme"><span class="forme-lbl">Forme</span>${forme.slice().reverse().map(r=>`<span class="wl-dot" title="${esc(r.opp)} (${r.type})" style="background:${r.result==='W'?'var(--ok)':r.result==='L'?'var(--err)':'var(--muted)'}">${r.result==='W'?'V':r.result==='L'?'D':'N'}</span>`).join('')}</div>`;
  html+=`<table class="mtable"><thead><tr><th>Date</th><th>Adversaire</th><th>Type</th><th>Score</th><th></th></tr></thead><tbody>${
    rows.slice(0,8).map(r=>`<tr data-row onclick="${r.type==='Officiel'?`openEditOffi('${r.id}')`:`location.href='plazma-scrim.html#${encodeURIComponent(r.id)}'`}">
        <td style="color:var(--muted)">${fmtDay(r.date)}</td>
        <td style="font-weight:500">${esc(r.opp)}</td>
        <td><span class="mtype">${r.type}</span></td>
        <td class="mono" style="color:var(--dim)">${esc(r.score)}</td>
        <td><span class="mres ${r.result}">${r.result==='W'?'V':r.result==='L'?'D':'N'}</span></td>
      </tr>`).join('')}</tbody></table>`;
  el.innerHTML=html;
}

function renderObjectives(){
  const list=document.getElementById('objList');
  if(!state.objectives.length){ list.innerHTML='<div class="empty">Aucun objectif pour l’instant.</div>'; return; }
  const order={high:0,medium:1,low:2};
  const sorted=[...state.objectives].sort((a,b)=>(order[a.priority??'medium'])-(order[b.priority??'medium']));
  const today=todayIso();
  list.innerHTML=sorted.map(o=>{
    const color=o.priority==='high'?'var(--err)':o.priority==='low'?'var(--ok)':'var(--warn)';
    const stLbl=o.status==='done'?'Terminé':o.status==='progress'?'En cours':'À faire';
    const overdue=o.deadline&&o.deadline<today&&o.status!=='done';
    return `<div class="obj" onclick="openEditObj('${o.id}')">
      <div class="obj-top"><div class="obj-name">${esc(o.name)}</div>
        <div class="obj-badges"><span class="badge" style="color:${color}">${o.priority==='high'?'Urgent':o.priority==='low'?'Faible':'Normal'}</span><span class="badge">${stLbl}</span></div></div>
      <div class="obj-bar"><div class="obj-track"><div class="obj-fill" style="width:${o.pct||0}%;background:${color}"></div></div><div class="obj-pct">${o.pct||0}%</div></div>
      ${o.deadline?`<div class="obj-dl" style="color:${overdue?'var(--err)':'var(--muted)'}">${overdue?'En retard · ':''}Échéance ${new Date(o.deadline).toLocaleDateString('fr-FR',{day:'2-digit',month:'long'})}</div>`:''}
    </div>`;
  }).join('');
}

// Roster : joueurs du roster central + lien op.gg (le rang se lit sur op.gg, plus de saisie manuelle).
function opggOf(id){ const r=(state.roster||[]).find(x=>x.id===id); return r&&r.opgg||''; }
function rosterPlayers(){ return PZ.getRoster ? PZ.getRoster() : []; }
function renderRoster(){
  const el=document.getElementById('roster');
  el.innerHTML=rosterPlayers().map(p=>{
    const id=opggOf(p.id);
    const url=id?`https://www.op.gg/summoners/euw/${encodeURIComponent(id)}`:'';
    return `<div class="rrow"><span class="rrow-dot" style="background:${p.color}"></span>
      <div class="rrow-main"><div class="rrow-name">${esc(p.name)}</div><div class="rrow-role">${esc(p.role)}</div></div>
      ${url?`<a href="${url}" target="_blank" rel="noopener">op.gg →</a>`:`<span class="off" title="À renseigner dans Paramètres">op.gg —</span>`}</div>`;
  }).join('');
}
function renderSettingsForm(){
  document.getElementById('p_nextEvent').value=state.nextEvent||'';
  document.getElementById('p_nextEventDate').value=state.nextEventDate||'';
  document.getElementById('p_goal').value=state.goal||'';
  const cfg=document.getElementById('rosterConfig');
  if(cfg.contains(document.activeElement)) return;
  cfg.innerHTML=rosterPlayers().map(p=>`
    <div class="rcr"><div style="font-size:12.5px;color:var(--dim)">${esc(p.name)} <span style="color:var(--muted)">· ${esc(p.role)}</span></div>
    <input id="opgg_${p.id}" value="${esc(opggOf(p.id))}" placeholder="Pseudo-TAG"></div>`).join('');
}

// ── SYNC (doc dashboard) ──
function getState(){ return {nextEvent:state.nextEvent,nextEventDate:state.nextEventDate,goal:state.goal,roster:state.roster,objectives:state.objectives,officials:state.officials}; }
function applyState(s){
  if(!s) return;
  Object.assign(state,{nextEvent:s.nextEvent||'',nextEventDate:s.nextEventDate||'',goal:s.goal||'',
    roster:Array.isArray(s.roster)?s.roster:[], objectives:s.objectives??[], officials:s.officials??[]});
}
const sync = PZ.sync({ docId:'dashboard', getState, applyState, onData:render });
PZ.onRoster(()=>render());

// ── Agrégation (CR · Planning · Scouting) ──
async function loadAggregates(){
  const db=PZ.db;
  const can = s => !(PZ.auth && PZ.auth.can) || PZ.auth.can(s);
  const a={ stats:null, week:{}, weekDenied:!can('planning'), avail:{}, scoutLatest:false, scoutDenied:!can('scouting') };
  try{ a.stats=await PZ.stats.load({weeks:4}); }
  catch(e){ console.error('stats',e); a.stats={crs:[],scrims:{w:0,l:0,d:0,total:0,wr:null},games:{w:0,l:0,total:0,wr:null},perGame:{},coverage:{planned:0,withCr:0,missing:[]},presence:{rate:null},topErrors:[],canScrim:false,canPlan:false}; }
  if(db && !a.weekDenied){
    try{ const d=await db.collection(PZ.COLLECTION).doc('schedule-'+currentWeekValue()).get(); a.week=(d.exists&&d.data().schedule)||{}; }
    catch(e){ console.error('planning',e); }
    try{
      const snap=await db.collection('plazma-availability').where('week','==',currentWeekValue()).get();
      snap.forEach(dd=>{ const days=(dd.data()||{}).days||{}; Object.keys(days).forEach(day=>{ if(days[day]==='yes') a.avail[day]=(a.avail[day]||0)+1; }); });
    }catch(e){ console.error('avail',e); }
  }
  if(db && !a.scoutDenied){
    try{
      let snap;
      try{ snap=await db.collection('plazma-scouting').orderBy('_savedAt','desc').limit(1).get(); }
      catch(e){ snap=await db.collection('plazma-scouting').get(); }
      let best=null; snap.forEach(d=>{ const x={id:d.id,...d.data()}; const t=x._savedAt&&x._savedAt.toMillis?x._savedAt.toMillis():0; if(!best||t>best._t) best=Object.assign(x,{_t:t}); });
      a.scoutLatest=best||false;
    }catch(e){ console.error('scouting',e); }
  }
  a.rosterSize=rosterPlayers().length||5;
  agg=a; render();
}

// ── MODAL OFFICIEL ──
function openAddOffi(){
  _editId=null;
  ['mOpp','mScore','mNote'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('mRes').value='W';
  document.getElementById('mDate').value=new Date().toISOString().split('T')[0];
  document.getElementById('mTitle').textContent='Ajouter un match officiel';
  document.getElementById('mDel').style.display='none'; document.getElementById('mConf').textContent='Ajouter';
  document.getElementById('ovMatch').classList.add('open');
  setTimeout(()=>document.getElementById('mOpp').focus(),50);
}
function openEditOffi(id){
  const m=state.officials.find(x=>x.id===id); if(!m)return; _editId=id;
  document.getElementById('mTitle').textContent='Modifier le match officiel';
  document.getElementById('mOpp').value=m.opp||''; document.getElementById('mRes').value=m.result||'W';
  document.getElementById('mScore').value=m.score||''; document.getElementById('mDate').value=m.date||'';
  document.getElementById('mNote').value=m.note||'';
  document.getElementById('mDel').style.display='inline-flex'; document.getElementById('mConf').textContent='Enregistrer';
  document.getElementById('ovMatch').classList.add('open');
}
document.getElementById('mConf').addEventListener('click',()=>{
  const opp=document.getElementById('mOpp').value.trim(); if(!opp){showToast("L'adversaire est requis");return;}
  const data={opp,result:document.getElementById('mRes').value,score:document.getElementById('mScore').value.trim(),
    date:document.getElementById('mDate').value,note:document.getElementById('mNote').value.trim()};
  if(_editId)Object.assign(state.officials.find(m=>m.id===_editId),data); else state.officials.push({id:uid(),...data});
  closeModals(); render(); sync.save();
});
function deleteOffi(){ if(!confirm('Supprimer ce match officiel ?'))return; state.officials=state.officials.filter(m=>m.id!==_editId); closeModals(); render(); sync.save(); }

// ── MODAL OBJECTIF ──
function openAddObj(){
  _editId=null;
  document.getElementById('oTitle').textContent='Ajouter un objectif';
  document.getElementById('oName').value=''; document.getElementById('oPrio').value='medium';
  document.getElementById('oStatus').value='todo'; document.getElementById('oPct').value='0'; document.getElementById('oDl').value='';
  document.getElementById('oDel').style.display='none'; document.getElementById('oConf').textContent='Ajouter';
  document.getElementById('ovObj').classList.add('open'); setTimeout(()=>document.getElementById('oName').focus(),50);
}
function openEditObj(id){
  const o=state.objectives.find(x=>x.id===id); if(!o)return; _editId=id;
  document.getElementById('oTitle').textContent="Modifier l'objectif";
  document.getElementById('oName').value=o.name; document.getElementById('oPrio').value=o.priority;
  document.getElementById('oStatus').value=o.status; document.getElementById('oPct').value=o.pct??0; document.getElementById('oDl').value=o.deadline||'';
  document.getElementById('oDel').style.display='inline-flex'; document.getElementById('oConf').textContent='Enregistrer';
  document.getElementById('ovObj').classList.add('open');
}
document.getElementById('oConf').addEventListener('click',()=>{
  const name=document.getElementById('oName').value.trim(); if(!name){showToast("L'objectif est requis");return;}
  const data={name,priority:document.getElementById('oPrio').value,status:document.getElementById('oStatus').value,
    pct:Math.min(100,Math.max(0,parseInt(document.getElementById('oPct').value)||0)),deadline:document.getElementById('oDl').value};
  if(_editId)Object.assign(state.objectives.find(o=>o.id===_editId),data); else state.objectives.push({id:uid(),...data});
  closeModals(); render(); sync.save();
});
function deleteObj(){ if(!confirm('Supprimer cet objectif ?'))return; state.objectives=state.objectives.filter(o=>o.id!==_editId); closeModals(); render(); sync.save(); }

function saveSettings(){
  state.nextEvent=document.getElementById('p_nextEvent').value.trim();
  state.nextEventDate=document.getElementById('p_nextEventDate').value;
  state.goal=document.getElementById('p_goal').value.trim();
  rosterPlayers().forEach(p=>{
    const e=document.getElementById('opgg_'+p.id); if(!e) return;
    let r=state.roster.find(x=>x.id===p.id); if(!r){ r={id:p.id}; state.roster.push(r); }
    r.opgg=e.value.trim();
  });
  render(); sync.save(); showToast('Paramètres enregistrés');
}

// ── Toolbar ──
document.getElementById('btnRefresh').addEventListener('click',()=>{ agg=null; render(); loadAggregates(); showToast('Données actualisées'); });
// Retour depuis un CR ou le Planning : on rafraîchit les agrégats.
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && agg) loadAggregates(); });

// ── Utils ──
let _uidC=0; function uid(){ return Date.now().toString(36)+(++_uidC).toString(36); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function closeModals(){ document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('open')); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
document.querySelectorAll('.overlay').forEach(ov=>ov.addEventListener('click',e=>{ if(e.target===ov)closeModals(); }));
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModals(); });

const _d=new Date();
document.getElementById('dateSub').textContent='Semaine '+getWeekNum(_d)+' · '+_d.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
render();
if(PZ.auth && PZ.auth.ready) PZ.auth.ready.then(loadAggregates); else loadAggregates();
</script>
