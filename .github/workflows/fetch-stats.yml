name: Fetch player stats

on:
  workflow_dispatch:   # déclenchement manuel depuis l'onglet Actions
  schedule:
    - cron: '0 7,13,19 * * *'   # 7h, 13h, 19h UTC chaque jour

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout branche test
        uses: actions/checkout@v4
        with:
          ref: test/riot-stats

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Riot API stats
        run: node scripts/fetch-stats.js
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}

      - name: Commit stats-output.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats-output.json
          git diff --staged --quiet || git commit -m "chore: update player stats [skip ci]"
          git push
