name: Build client Windows (.exe)

# Construit client/dist/archi-client.exe à chaque modif du client, et sur demande.
# L'exe est masqué (sous-système GUI : pas de fenêtre de terminal) et téléchargeable
# dans l'onglet Actions (run → « Artifacts »).
on:
  push:
    paths: ['client/**', 'scripts/pe-gui.js', '.github/workflows/build-client.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - name: Masquer la console (console -> GUI)
        run: node ../scripts/pe-gui.js dist/archi-client.exe
      - uses: actions/upload-artifact@v4
        with:
          name: archi-client-windows
          path: client/dist/archi-client.exe
          if-no-files-found: error
