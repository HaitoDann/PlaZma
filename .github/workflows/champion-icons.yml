name: Synchro icônes champions

# Met à jour les icônes de champions hébergées dans le repo (assets/champions/)
# une fois par jour depuis Data Dragon. Le site sert ces fichiers locaux ;
# Data Dragon / Community Dragon ne servent plus que de secours côté client.

on:
  schedule:
    - cron: '17 4 * * *'        # tous les jours ~04:17 UTC
  workflow_dispatch:            # déclenchement manuel (bouton "Run workflow")
  push:
    paths:                      # (re)synchro quand on modifie le script/workflow
      - 'scripts/update_champion_icons.py'
      - '.github/workflows/champion-icons.yml'

permissions:
  contents: write

concurrency:
  group: champion-icons
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger les icônes
        run: python3 scripts/update_champion_icons.py

      - name: Commit si changement
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/champions
          if git diff --cached --quiet; then
            echo "Aucune mise à jour d'icônes."
          else
            git commit -m "Icônes champions : synchro Data Dragon [skip ci]"
            git push
          fi
