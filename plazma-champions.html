<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/logo-plazma.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHI — Champions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css?v=3.12.0">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
  .content{max-width:var(--page-max);margin:0 auto;padding:24px var(--gut) 80px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .page-head .eyebrow{margin-bottom:4px}

  /* Barre de recherche + filtres rôles */
  .cx-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .cx-search{flex:1;min-width:200px;max-width:340px}
  .cx-roles{display:flex;gap:6px;flex-wrap:wrap}
  .cx-role{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;cursor:pointer;
    background:var(--surface-2);border:1px solid var(--border);color:var(--dim);font-family:var(--font);font-size:12.5px;font-weight:600}
  .cx-role:hover{border-color:var(--border-2);color:var(--text)}
  .cx-role.active{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .cx-count{font-size:12px;color:var(--muted);margin-left:auto}

  /* Grille de champions */
  .cx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
  .cx-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:var(--r);cursor:pointer;
    background:var(--surface);border:1px solid var(--border);transition:border-color .12s,transform .08s}
  .cx-card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .cx-card img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--surface-2)}
  .cx-card .nm{font-size:11.5px;font-weight:600;text-align:center;line-height:1.15;color:var(--text)}
  .cx-empty{padding:40px;text-align:center;color:var(--muted)}

  /* Détail (overlay) */
  .cx-ov{position:fixed;inset:0;background:rgba(6,10,14,.66);backdrop-filter:blur(3px);z-index:60;display:none;
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
  .cx-ov.open{display:flex}
  .cx-modal{width:100%;max-width:760px;background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-lg,16px);
    padding:0;overflow:hidden;animation:cxIn .16s ease}
  @keyframes cxIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .cx-hd{display:flex;align-items:center;gap:16px;padding:20px 22px;border-bottom:1px solid var(--border);position:relative;
    background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 8%,transparent),transparent)}
  .cx-hd img{width:72px;height:72px;border-radius:14px;object-fit:cover;background:var(--surface-2);flex-shrink:0}
  .cx-hd h2{font-family:var(--font-display);font-size:22px;line-height:1.1;margin:0}
  .cx-hd .ttl{color:var(--accent);font-size:13px;font-weight:600;margin-top:2px}
  .cx-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .cx-tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--dim)}
  .cx-close{position:absolute;top:14px;right:16px;width:30px;height:30px;border:none;border-radius:8px;cursor:pointer;
    background:var(--surface-2);color:var(--dim);font-size:16px;line-height:1}
  .cx-close:hover{color:var(--text);background:var(--border)}
  .cx-body{padding:18px 22px 24px}
  .cx-lore{font-size:13px;color:var(--dim);line-height:1.5;margin-bottom:18px}
  .cx-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:20px}
  .cx-meta b{color:var(--text);font-weight:600}

  .cx-ab{display:flex;gap:13px;padding:13px 0;border-top:1px solid var(--border)}
  .cx-ab img{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--surface-2);flex-shrink:0}
  .cx-ab-main{flex:1;min-width:0}
  .cx-ab-hd{display:flex;align-items:baseline;gap:9px;margin-bottom:4px;flex-wrap:wrap}
  .cx-key{font-family:var(--font-mono);font-size:11px;font-weight:600;color:#0a0f14;background:var(--accent);
    border-radius:5px;padding:2px 6px;line-height:1}
  .cx-key.p{background:var(--dim)}
  .cx-ab-nm{font-size:13.5px;font-weight:600;color:var(--text)}
  .cx-ab-desc{font-size:12.5px;color:var(--dim);line-height:1.5}
  .cx-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:7px;font-size:11px;color:var(--muted)}
  .cx-stats span b{color:var(--text);font-weight:600;font-family:var(--font-mono)}

  .cx-note{font-size:11.5px;color:var(--muted);margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
</style>
</head>
<body>

<div class="loader"><div class="loader-inner"><div class="loader-ring-wrap"><div class="loader-arc1"></div><div class="loader-arc2"></div><img class="loader-logo" src="assets/logo-plazma.png" alt=""></div><div class="loader-mark">ARCHI</div></div></div>
<div id="nav"></div>

<div class="content">
  <div class="page-head">
    <div>
      <div class="eyebrow">PlaZma Esport</div>
      <h1>Champions</h1>
    </div>
  </div>

  <div class="cx-bar">
    <input type="text" class="cx-search" id="cxSearch" placeholder="Rechercher un champion…" autocomplete="off">
    <div class="cx-roles" id="cxRoles"></div>
    <span class="cx-count" id="cxCount"></span>
  </div>

  <div class="cx-grid" id="cxGrid"></div>
  <div class="cx-empty" id="cxEmpty" style="display:none"></div>
</div>

<div class="cx-ov" id="cxOv">
  <div class="cx-modal" id="cxModal"></div>
</div>

<script src="assets/plazma.js?v=3.12.0" data-section="champions"></script>
<script>
PZ.mountNav('champions', '#nav');
PZ.loadingDone();

(function () {
  const ROLES = [
    { k: 'all', label: 'Tous' },
    { k: 'fighter', label: 'Combattant' },
    { k: 'tank', label: 'Tank' },
    { k: 'mage', label: 'Mage' },
    { k: 'assassin', label: 'Assassin' },
    { k: 'marksman', label: 'Tireur' },
    { k: 'support', label: 'Support' },
  ];
  const ICON = id => 'https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default/v1/champion-icons/' + id + '.png';
  const FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56"><rect width="56" height="56" fill="%23223"/></svg>');

  let DATA = [], role = 'all', q = '';
  const grid = document.getElementById('cxGrid'), empty = document.getElementById('cxEmpty'),
        countEl = document.getElementById('cxCount'), rolesEl = document.getElementById('cxRoles'),
        search = document.getElementById('cxSearch'), ov = document.getElementById('cxOv'),
        modal = document.getElementById('cxModal');

  // Filtres rôles
  rolesEl.innerHTML = ROLES.map(r => `<button class="cx-role${r.k === 'all' ? ' active' : ''}" data-role="${r.k}">${r.label}</button>`).join('');
  rolesEl.addEventListener('click', e => {
    const b = e.target.closest('.cx-role'); if (!b) return;
    role = b.dataset.role;
    rolesEl.querySelectorAll('.cx-role').forEach(x => x.classList.toggle('active', x === b));
    render();
  });
  search.addEventListener('input', () => { q = search.value.trim().toLowerCase(); render(); });

  function norm(s) { return (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

  function render() {
    const nq = norm(q);
    const list = DATA.filter(c =>
      (role === 'all' || (c.roles || []).includes(role)) &&
      (!nq || norm(c.name).includes(nq) || norm(c.title).includes(nq)));
    countEl.textContent = list.length + ' champion' + (list.length > 1 ? 's' : '');
    if (!list.length) { grid.innerHTML = ''; empty.style.display = 'block'; empty.textContent = 'Aucun champion ne correspond.'; return; }
    empty.style.display = 'none';
    grid.innerHTML = list.map(c =>
      `<div class="cx-card" data-id="${c.id}"><img src="${ICON(c.id)}" alt="" loading="lazy" onerror="this.src='${FALLBACK}'"><span class="nm">${c.name}</span></div>`).join('');
  }
  grid.addEventListener('click', e => {
    const card = e.target.closest('.cx-card'); if (!card) return;
    const c = DATA.find(x => x.id == card.dataset.id); if (c) openDetail(c);
  });

  const DMG = { Physical: 'Dégâts physiques', Magic: 'Dégâts magiques', Mixed: 'Dégâts mixtes', True: 'Dégâts bruts' };
  const DIFF = { 1: 'Facile', 2: 'Facile', 3: 'Modéré', 4: 'Modéré', 5: 'Difficile' };
  const fmtArr = a => Array.isArray(a) && a.length ? (a.length === 1 ? a[0] : a.join(' / ')) : null;

  function ability(a, keyLabel, isPassive) {
    if (!a || !a.name) return '';
    const stats = [];
    if (!isPassive) {
      const cd = fmtArr(a.cooldown), cost = fmtArr(a.cost), rng = fmtArr(a.range);
      if (cd) stats.push(`<span>Récup. <b>${cd}</b>s</span>`);
      if (cost) stats.push(`<span>Coût <b>${cost}</b></span>`);
      if (rng) stats.push(`<span>Portée <b>${rng}</b></span>`);
    }
    return `<div class="cx-ab">
      ${a.icon ? `<img src="${a.icon}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : '<div style="width:46px"></div>'}
      <div class="cx-ab-main">
        <div class="cx-ab-hd"><span class="cx-key${isPassive ? ' p' : ''}">${keyLabel}</span><span class="cx-ab-nm">${a.name}</span></div>
        <div class="cx-ab-desc">${a.desc || ''}</div>
        ${stats.length ? `<div class="cx-stats">${stats.join('')}</div>` : ''}
      </div></div>`;
  }

  function openDetail(c) {
    const meta = [];
    if (c.tags && c.tags.length) {} // tags affichés en en-tête
    if (c.damageType && DMG[c.damageType]) meta.push(`<span><b>${DMG[c.damageType]}</b></span>`);
    if (c.attackType) meta.push(`<span>Attaque <b>${c.attackType === 'melee' ? 'au corps à corps' : 'à distance'}</b></span>`);
    if (c.difficulty && DIFF[c.difficulty]) meta.push(`<span>Difficulté <b>${DIFF[c.difficulty]}</b></span>`);
    const spells = (c.spells || []).map(s => ability(s, s.key, false)).join('');
    modal.innerHTML = `
      <div class="cx-hd">
        <img src="${ICON(c.id)}" alt="" onerror="this.src='${FALLBACK}'">
        <div>
          <h2>${c.name}</h2>
          <div class="ttl">${c.title || ''}</div>
          ${c.tags && c.tags.length ? `<div class="cx-tags">${c.tags.map(t => `<span class="cx-tag">${t}</span>`).join('')}</div>` : ''}
        </div>
        <button class="cx-close" id="cxClose" aria-label="Fermer">✕</button>
      </div>
      <div class="cx-body">
        ${c.lore ? `<div class="cx-lore">${c.lore}</div>` : ''}
        ${meta.length ? `<div class="cx-meta">${meta.join('')}</div>` : ''}
        ${c.passive ? ability(c.passive, 'Passif', true) : ''}
        ${spells}
        ${(!c.spells || !c.spells.length) ? '<div class="cx-note">Détail des sorts non disponible pour ce champion (relance ARCHI Link pour régénérer les données).</div>' : ''}
      </div>`;
    document.getElementById('cxClose').onclick = close;
    ov.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function close() { ov.classList.remove('open'); document.body.style.overflow = ''; }
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  // Chargement des données (générées par ARCHI Link → assets/champions-wiki.json)
  fetch('assets/champions-wiki.json?v=3.12.0')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => {
      DATA = (d.champions || []).filter(c => c.id > 0);
      render();
      if (d.generatedAt) {
        const note = document.createElement('div');
        note.className = 'legend';
        note.style.marginTop = '22px';
        note.textContent = 'Données extraites du client League par ARCHI Link' + (d.patch ? ' · patch ' + d.patch : '') + ' · ' + d.count + ' champions.';
        document.querySelector('.content').appendChild(note);
      }
    })
    .catch(err => {
      grid.innerHTML = '';
      empty.style.display = 'block';
      empty.innerHTML = 'Données champions indisponibles.<br><span class="muted" style="font-size:12px">Lance ARCHI Link avec l\'option « wiki » puis copie <code>archi-data/gamedata/champions-wiki.json</code> dans <code>assets/</code>.</span>';
    });
})();
</script>
</body>
</html>
