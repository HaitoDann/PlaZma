<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/logo-plazma.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHI — Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css?v=20260821h">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
.content{max-width:1280px;margin:0 auto;padding:20px var(--gut) 80px}
.draft-wrap{display:grid;grid-template-columns:1fr 288px;gap:16px;align-items:start}

/* Scenario tabs */
.scn-tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.scn-tab{padding:7px 13px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;
  color:var(--muted);background:var(--surface-2);border:1px solid var(--border);transition:all .15s}
.scn-tab:hover{color:var(--dim)}
.scn-tab.active{color:var(--text);border-color:var(--accent-line);background:var(--accent-soft)}

/* Draft board */
.draft-board{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}
.draft-teams{display:grid;grid-template-columns:1fr 56px 1fr;gap:8px;padding:13px 16px;border-bottom:1px solid var(--border)}
.team-inp.blue{border-left:3px solid #3b82f6}
.team-inp.red{border-left:3px solid #ef4444;text-align:right}
.team-vs{display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:var(--muted);font-size:13px}

/* Bans row */
.bans-row{display:grid;grid-template-columns:1fr 68px 1fr;gap:6px;padding:9px 16px;background:rgba(0,0,0,.18);border-bottom:1px solid var(--border)}
.bans-side{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.bans-side.red{justify-content:flex-end}
.bans-lbl{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;line-height:1.3}
.ban-slot{width:36px;height:36px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface-2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;
  color:var(--muted);font-size:13px;transition:border-color .15s,box-shadow .2s;flex-shrink:0}
.ban-slot:hover{border-color:var(--accent)}
.ban-slot.filled::after{content:'';position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 2px rgba(239,68,68,.35)}
.ban-slot img{width:100%;height:100%;object-fit:cover;border-radius:7px;filter:grayscale(.35)}
.clr-x{position:absolute;top:-5px;right:-5px;width:15px;height:15px;border-radius:50%;
  background:var(--elevated);border:1px solid var(--border-2);color:var(--muted);
  font-size:8px;line-height:13px;text-align:center;display:none;cursor:pointer;z-index:2}
.ban-slot.filled:hover .clr-x,.pick-slot.filled:hover .clr-x{display:block}
.clr-x:hover{color:var(--err) !important}

/* Pick rows */
.picks-section{padding:4px 16px 4px}
.pick-row{display:grid;grid-template-columns:1fr 66px 1fr;gap:8px;align-items:center;padding:4px 0}
.pick-role-col{display:flex;align-items:center;justify-content:center}
.pick-slot{display:flex;align-items:center;gap:7px;min-height:48px;padding:5px 9px;
  border-radius:9px;cursor:pointer;background:var(--surface-2);border:1px solid var(--border-2);
  position:relative;transition:border-color .15s,box-shadow .2s;overflow:visible}
.pick-slot.blue{border-left:3px solid #3b82f6}
.pick-slot.red{border-left:3px solid #ef4444;flex-direction:row-reverse;text-align:right}
.pick-slot:hover{border-color:var(--accent)}
.pick-slot img{width:34px;height:34px;border-radius:8px;object-fit:cover;flex-shrink:0}
.ps-name{flex:1;font-size:13px;color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ps-ph{flex:1;font-size:12.5px;color:var(--muted)}
/* ★ in-pool indicator */
.pick-slot.in-pool .ps-name::after{content:' ★';font-size:10px;color:var(--ok)}

/* Active step pulse */
.active-step{border-color:var(--accent) !important;box-shadow:0 0 0 3px var(--accent-soft);animation:step-pulse 1.4s ease-in-out infinite}
@keyframes step-pulse{0%,100%{box-shadow:0 0 0 3px var(--accent-soft)}60%{box-shadow:0 0 0 5px rgba(34,211,238,.04)}}

/* Step navigator */
.step-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 16px;border-top:1px solid var(--border);transition:background .4s,border-color .4s}
.step-nav.done{background:rgba(34,197,94,.06);border-color:rgba(34,197,94,.2)}
.step-info{text-align:center;min-width:90px}
.step-num{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--dim)}
.step-num.done{color:var(--ok)}
.step-desc{font-size:11px;color:var(--muted);margin-top:1px}

/* Copier la compo — toast */
.copy-toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);
  background:var(--elevated);border:1px solid var(--border-2);color:var(--text);
  font-size:13px;font-weight:600;padding:10px 20px;border-radius:999px;
  box-shadow:var(--shadow-3);z-index:300;opacity:0;
  transition:opacity .2s,transform .2s;pointer-events:none;
}
.copy-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Side picker */
.side-tabs{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;gap:0}
.side-tab{padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer;background:var(--surface-2);border:none;color:var(--muted);transition:all .15s;font-family:var(--font)}
.side-tab.blue.active{background:rgba(59,130,246,.25);color:#60a5fa}
.side-tab.red.active{background:rgba(239,68,68,.25);color:#f87171}
.side-tab:hover:not(.active){color:var(--dim)}

/* Analysis panel */
.analysis-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;position:sticky;top:68px}
.ap-section{margin-bottom:16px}
.ap-section:last-child{margin-bottom:0}
.ap-title{font-size:10.5px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;display:flex;align-items:center;gap:5px}
.ap-title::before{content:'';width:3px;height:10px;border-radius:2px;background:currentColor;flex-shrink:0}

/* Pool chips */
.pool-wrap{display:flex;flex-wrap:wrap;gap:4px}
.pool-chip{width:32px;height:32px;border-radius:7px;border:1px solid var(--border-2);overflow:hidden;flex-shrink:0;background:var(--surface-2)}
.pool-chip img{width:100%;height:100%;object-fit:cover;display:block}
.pool-chip.used{opacity:.28;filter:grayscale(1)}

/* Comp bars */
.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.bar-lbl{font-size:11px;font-weight:600;color:var(--dim);width:68px;flex-shrink:0;white-space:nowrap}
.bar-track{flex:1;height:5px;border-radius:3px;background:var(--border-2);overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .35s ease}
.bar-val{font-size:11px;color:var(--muted);width:14px;text-align:right;font-family:var(--font-mono);flex-shrink:0}
.comp-name{font-family:var(--font-display);font-weight:700;font-size:.95rem;color:var(--accent);margin:7px 0 4px;min-height:1.2em}
.comp-name.red{color:#f87171}
.gap-line{font-size:11.5px;color:var(--warn);margin-bottom:4px;padding-left:14px;position:relative}
.gap-line::before{content:'⚠';position:absolute;left:0;font-size:10px}

/* Drawer */
.drawer-ov{position:fixed;inset:0;background:rgba(6,10,14,.6);backdrop-filter:blur(4px);z-index:180;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-ov.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:370px;max-width:94vw;background:var(--surface);
  border-left:1px solid var(--border-2);z-index:181;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.drawer-list{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.dr-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer}
.dr-card:hover{border-color:var(--border-2)}.dr-card.active-doc{border-color:var(--accent)}
.dr-main{display:flex;gap:10px;padding:11px 13px;align-items:flex-start}
.dr-actions{display:flex;border-top:1px solid var(--border)}
.dr-actions button{flex:1;background:none;border:none;padding:8px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:var(--font)}
.dr-actions button+button{border-left:1px solid var(--border)}
.dr-actions button:hover{color:var(--text)}
.drawer-empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 20px}

/* Import scouting modal */
.scout-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;
  border:1px solid var(--border);background:var(--surface-2);margin-bottom:7px;transition:border-color .15s}
.scout-item:hover{border-color:var(--accent)}

/* Synergy pills */
.syn-pills{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0 6px}
.syn-pill{font-size:10px;font-weight:700;background:rgba(34,197,94,.12);color:#4ade80;
  border:1px solid rgba(34,197,94,.22);border-radius:999px;padding:2px 8px;white-space:nowrap}

/* Timing */
.timing-row{display:flex;gap:3px;margin:6px 0 2px}
.timing-cell{flex:1;text-align:center;font-size:9.5px;font-weight:700;padding:4px 2px;border-radius:6px;
  background:var(--surface-2);border:1px solid var(--border-2);color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;transition:all .2s}
.timing-cell.peak{background:rgba(34,211,238,.14);border-color:rgba(34,211,238,.3);color:#67e8f9}

/* Win condition */
.win-cond{font-size:11px;color:var(--dim);line-height:1.45;margin:4px 0 0;font-style:italic;min-height:.8em}

/* Cross-analysis */
.threat-line{font-size:11px;color:var(--err);margin-bottom:4px;padding-left:15px;position:relative;line-height:1.4}
.threat-line::before{content:'⚡';position:absolute;left:0;font-size:10px;top:1px}
.adv-line{font-size:11px;color:var(--ok);margin-bottom:4px;padding-left:15px;position:relative;line-height:1.4}
.adv-line::before{content:'✓';position:absolute;left:0;font-size:10px;font-weight:700;top:1px}
.cross-sep{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:7px 0 4px}

/* Pool fit */
.pool-chip{position:relative}
.fit-dot{position:absolute;bottom:-3px;right:-3px;width:9px;height:9px;border-radius:50%;
  border:1.5px solid var(--surface);z-index:1}
.pool-chip.fit-high{border-color:rgba(74,222,128,.5) !important}
.pool-chip.fit-med{border-color:rgba(251,191,36,.4) !important}
.pool-rec-badge{position:absolute;top:-5px;left:50%;transform:translateX(-50%);
  font-size:8px;font-weight:800;color:#4ade80;white-space:nowrap;pointer-events:none}

@media(max-width:900px){
  .draft-wrap{grid-template-columns:1fr}
  .analysis-panel{position:static}
  .draft-teams{grid-template-columns:1fr}
  .bans-row{grid-template-columns:1fr}
  .bans-lbl{display:none}
  .pick-row{grid-template-columns:1fr}
  .pick-role-col{justify-content:flex-start}
  .pick-slot.red{flex-direction:row;text-align:left}
}
</style>
</head>
<body>

<div class="loader"><div class="loader-inner"><div class="loader-ring-wrap"><div class="loader-arc1"></div><div class="loader-arc2"></div><img class="loader-logo" src="assets/logo-plazma.png" alt=""></div><div class="loader-mark">ARCHI</div></div></div>
<div id="nav"></div>

<div class="content">
  <div class="toolbar" data-noexport>
    <span class="sync-pill"><span class="sync-dot offline" id="syncDot"></span><span id="syncText">En attente…</span><span class="sync-time" id="syncTime"></span></span>
    <div class="side-tabs">
      <button class="side-tab blue active" id="sideBlue" onclick="setPlazmaside('blue')">PlaZma Blue</button>
      <button class="side-tab red" id="sideRed" onclick="setPlazmaside('red')">PlaZma Red</button>
    </div>
    <span style="flex:1"></span>
    <button class="btn btn-sm" onclick="copyComp()" id="btnCopy" data-tip="Copier la compo en texte">📋</button>
    <button class="btn btn-sm" onclick="newDraft()" data-edit>＋ Nouvelle</button>
    <button class="btn btn-sm" onclick="openDrawer()">Historique <span id="draftCount" class="muted"></span></button>
    <button class="btn btn-sm" onclick="openScoutModal()" data-edit>📥 Scouting</button>
    <button class="btn btn-sm btn-danger" onclick="resetDraft()" data-edit>Vider</button>
  </div>

  <div class="scn-tabs" id="scnTabs"></div>

  <div class="draft-wrap">
    <!-- BOARD -->
    <div>
      <div class="draft-board">
        <div class="draft-teams">
          <input id="blueInp" class="team-inp blue" type="text" placeholder="Blue side">
          <div class="team-vs">VS</div>
          <input id="redInp" class="team-inp red" type="text" placeholder="Red side">
        </div>

        <div class="bans-row">
          <div class="bans-side blue" id="ban-blue-p1"></div>
          <div class="bans-lbl">Bans<br>Phase 1</div>
          <div class="bans-side red" id="ban-red-p1"></div>
        </div>

        <div class="picks-section" id="picksGrid"></div>

        <div class="bans-row">
          <div class="bans-side blue" id="ban-blue-p2"></div>
          <div class="bans-lbl">Bans<br>Phase 2</div>
          <div class="bans-side red" id="ban-red-p2"></div>
        </div>

        <div class="step-nav" id="stepNav">
          <button class="btn btn-sm" id="btnBack" onclick="stepBack()">◀ Reculer</button>
          <div class="step-info">
            <div class="step-num" id="stepNum">Étape 1 / 20</div>
            <div class="step-desc" id="stepDesc"></div>
          </div>
          <button class="btn btn-sm btn-primary" id="btnNext" onclick="stepNext()">Avancer ▶</button>
        </div>
      </div>
    </div>

    <!-- ANALYSIS -->
    <div class="analysis-panel">
      <div class="ap-section" id="poolSection" style="display:none">
        <div class="ap-title" id="poolTitle" style="color:var(--ok)">Pool joueur</div>
        <div class="pool-wrap" id="poolGrid"></div>
      </div>

      <div class="ap-section">
        <div class="ap-title">Composition Blue</div>
        <div id="barsBlue"></div>
        <div id="synBlue"></div>
        <div id="timingBlue" class="timing-row"></div>
        <div class="comp-name" id="nameBlue">—</div>
        <div id="wincondBlue" class="win-cond"></div>
      </div>

      <div class="ap-section">
        <div class="ap-title" style="color:#f87171">Composition Red</div>
        <div id="barsRed"></div>
        <div id="synRed"></div>
        <div id="timingRed" class="timing-row"></div>
        <div class="comp-name red" id="nameRed">—</div>
        <div id="wincondRed" class="win-cond"></div>
      </div>

      <div class="ap-section" id="crossSection" style="display:none">
        <div class="ap-title" style="color:var(--warn)">Analyse croisée</div>
        <div id="crossContent"></div>
      </div>

      <div class="ap-section" id="gapsSection" style="display:none">
        <div class="ap-title" style="color:var(--warn)">Manques PlaZma</div>
        <div id="gapsList"></div>
      </div>
    </div>
  </div>
</div>

<!-- Toast copie -->
<div class="copy-toast" id="copyToast">✓ Compo copiée</div>

<!-- Drawer historique -->
<div class="drawer-ov" id="drawerOv" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 style="font-size:1.1rem">Historique drafts</h2>
    <button class="btn btn-icon btn-ghost" onclick="closeDrawer()">✕</button>
  </div>
  <div style="padding:14px 14px 0">
    <button class="btn btn-primary" style="width:100%" onclick="newDraft();closeDrawer()">＋ Nouvelle draft</button>
  </div>
  <div class="drawer-list" id="drawerList"><div class="drawer-empty">Chargement…</div></div>
</div>

<!-- Modal import scouting -->
<div class="overlay" id="scoutOverlay">
  <div class="modal" style="width:480px">
    <div class="modal-title">📥 Importer depuis Scouting</div>
    <p style="font-size:13px;color:var(--muted);margin-bottom:14px">Sélectionne une fiche pour pré-remplir l'équipe adverse et le nom du scénario.</p>
    <div id="scoutList" style="max-height:300px;overflow-y:auto"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeScoutModal()">Annuler</button>
    </div>
  </div>
</div>

<script src="assets/plazma.js?v=20260818" data-section="scouting"></script>
<script src="assets/champions.js?v=20260818"></script>

// ── Timing (dérivé des axes) ──
function compTiming(scores, picks) {
  if (picks.filter(Boolean).length < 2) return null;
  const early = Math.min(10, (scores.e * 0.7 + scores.pk * 0.9) * 1.5);
  const mid   = Math.min(10, (scores.tf * 0.7 + scores.po * 0.7) * 1.4);
  const late  = Math.min(10, (scores.pr * 0.9 + scores.tf * 0.4 + scores.sp * 0.3) * 1.5);
  const peak  = early >= mid && early >= late ? 'early' : mid >= late ? 'mid' : 'late';
  return { early: Math.round(early), mid: Math.round(mid), late: Math.round(late), peak };
}

function renderTiming(elId, timing) {
  const el = document.getElementById(elId);
  if (!timing) { el.innerHTML = ''; return; }
  const labels = [{k:'early',l:'Early'},{k:'mid',l:'Mid'},{k:'late',l:'Late'}];
  el.innerHTML = labels.map(t =>
    `<div class="timing-cell${timing.peak===t.k?' peak':''}">${t.l}</div>`
  ).join('');
}

// ── Archétype de composition ──
function compArchetype(scores, picks) {
  if (picks.filter(Boolean).length < 2) return '—';
  const s = scores;
  if (s.e >= 5 && s.tf >= 3) return 'Engage comp';
  if (s.po >= 5 && s.e  < 2) return 'Poke comp';
  if (s.sp >= 5)              return 'Split push';
  if (s.pk >= 5 && s.e  < 2) return 'Pick comp';
  if (s.pr >= 5)              return 'Protect comp';
  if (s.tf >= 4 && s.po >= 3) return 'Poke-fight';
  if (s.tf >= 4)              return 'Team fight';
  if (s.e  >= 3 && s.pk >= 2) return 'Pick-engage';
  if (s.e  >= 3)              return 'Engage';
  if (s.po >= 3)              return 'Poke';
  if (s.pr >= 3)              return 'Protect / peel';
  if (s.sp >= 3)              return 'Split push';
  const top = Object.entries(s).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  return top.length ? top.slice(0,2).map(([k])=>AXIS_NAMES[k]).join(' / ') : 'Non définie';
}

// ── Condition de victoire (narrative) ──
function winCondition(scores, picks) {
  if (picks.filter(Boolean).length < 2) return '';
  const sorted = Object.entries(scores).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if (!sorted.length) return '';
  const [top, sec] = sorted;
  const descs = {
    e:  'Initier le combat, exploiter le chaos',
    tf: 'Gagner les teamfights et convertir sur objectifs',
    po: 'Poke en phase de siège, all-in quand adverse est bas',
    sp: 'Split-push, créer des réponses, ouvrir la map',
    pk: 'Isoler et éliminer les cibles clés avant le fight',
    pr: 'Protéger le carry, gagner les échanges prolongés',
  };
  const mods = { e:'via l\'engage', tf:'en teamfight', po:'après poke', sp:'avec pression map', pk:'par picks', pr:'avec protection' };
  let txt = descs[top[0]] || '';
  if (sec && sec[1] >= 2 && sec[0] !== top[0]) txt += ' — ' + (mods[sec[0]] || '');
  return txt;
}

// ── Analyse croisée Blue vs Red ──
function crossAnalysis(pzScores, oppScores, pzPicks, oppPicks) {
  const pzN  = pzPicks.filter(Boolean).length;
  const oppN = oppPicks.filter(Boolean).length;
  if (pzN < 2 || oppN < 2) return { threats:[], adv:[] };
  const threats = [], adv = [];
  if (oppScores.po > 4 && pzScores.e  > 3 && pzScores.po < 2)   threats.push('Leur poke contrecarré ton engage — approche difficile');
  if (oppScores.e  > 4 && pzScores.pr < 2 && pzScores.tf < 3)   threats.push('Leur engage est fort — carry non protégé ?');
  if (oppScores.sp > 4 && pzScores.e  < 2 && pzScores.tf > 3)   threats.push('Leur split est libre — impossible de forcer teamfight');
  if (oppScores.pk > 4 && pzScores.pr < 2)                       threats.push('Leur pick comp cible ton carry sans protection');
  if (oppScores.pr > 4 && pzScores.pk > 3)                       threats.push('Leur protection neutralise tes assassins / picks');
  if (oppScores.pr > 4 && pzScores.po < 2 && pzScores.e  < 3)   threats.push('Comp protect adverse — besoin de poke ou engage dur');
  if (pzScores.e  > oppScores.pr + 1 && pzScores.e  > 3)         adv.push('Ton engage surpasse leur protection');
  if (pzScores.po > 3 && oppScores.pr < 2)                        adv.push('Leur carry non protégé — poke et siege libres');
  if (pzScores.tf > oppScores.tf + 2)                             adv.push('Avantage net en teamfight 5v5');
  if (pzScores.sp > 3 && oppScores.e  < 2)                        adv.push('Ton split push est libre — aucun engage adverse');
  if (pzScores.pk > 3 && oppScores.pr < 2)                        adv.push('Tes assassins sont libres — pas de peel adverse');
  return { threats, adv };
}

// ── Fit score pour suggestions pool ──
function compNeeds(scores) {
  const needs = {};
  AXES.forEach(a => { needs[a.k] = Math.max(0, 3 - scores[a.k]); });
  return needs;
}
function fitScore(champId, needs) {
  const entry = DB[champId] || {};
  return Object.entries(needs).reduce((sum,[k,n]) => sum + (entry[k]||0)*n, 0);
}
function gapSuggestions(axisKey, pzPicks) {
  const allPool = Object.values(teamPools).flat().filter(id => !pzPicks.includes(id));
  return [...new Set(allPool)]
    .filter(id => (DB[id]?.[axisKey] || 0) >= 2)
    .sort((a,b) => (DB[b]?.[axisKey]||0)-(DB[a]?.[axisKey]||0))
    .slice(0,3);
}

function seqStepFor(type, team, idx) {
  return SEQ.findIndex(st => st.type === type && st.team === team && (type === 'ban' ? st.bi === idx : st.ri === idx));

function renderBans(elId, key, indices) {
  const s = scn(), el = document.getElementById(elId);
  el.innerHTML = '';
  indices.forEach(idx => {
    const id = s[key][idx];
    const ss = seqStepFor('ban', key === 'blueBans' ? 'blue' : 'red', idx);
    const active = ss === step && step < SEQ.length;
    const u = id && C() ? C().iconUrl(id) : '';
    const sl = document.createElement('div');
    sl.className = 'ban-slot' + (id ? ' filled' : '') + (active ? ' active-step' : '');
    sl.title = id && C() ? C().nameOf(id) : (active ? 'Cliquer pour baner' : '');
    sl.innerHTML = id
      ? (u ? `<img src="${u}" alt="">` : '🚫') + `<span class="clr-x">✕</span>`
      : '🚫';
    sl.addEventListener('click', e => {
      if (e.target.classList.contains('clr-x')) { s[key][idx] = ''; renderAll(); queueSave(); return; }
      C().open(cid => {
        if (!cid) return;
        s[key][idx] = cid;
        if (ss === step && step < SEQ.length) step = Math.min(step + 1, SEQ.length);
        renderAll(); queueSave();
      }, { exclude: allUsed(s) });
    });
    el.appendChild(sl);
  });
}

function renderPicks() {

function pickSlotHtml(id, side, active, ri) {

function renderStepNav() {

  document.getElementById('btnNext').disabled = done;
  nav.classList.toggle('done', done);
  if (done) {
    numEl.textContent = '✓ Draft complète';
    numEl.className = 'step-num done';
    document.getElementById('stepDesc').textContent = compArchetype(
      compScores(scn().bluePicks), scn().bluePicks
    ) + ' vs ' + compArchetype(compScores(scn().redPicks), scn().redPicks);
    return;
  }
  numEl.className = 'step-num';
  const cur = SEQ[step];
  const s = scn();
  const teamName = cur.team === 'blue'
    ? (s.blueTeam || '🔵 Bleu')

  const roleFr = cur.type === 'pick' ? ' · ' + ROLES[cur.ri].label : '';

function compGaps(picks, scores) {
  if (picks.filter(Boolean).length < 3) return [];
  const g = [];
  if (scores.e  < 2)                    g.push({msg:'Pas d\'initiateur fort — comment tu engages ?',  axis:'e'});
  if (scores.po < 2 && scores.e  < 2)   g.push({msg:'Peu de moyen de forcer l\'engagement adverse',   axis:'e'});
  if (scores.pr < 2 && scores.tf > 4)   g.push({msg:'Teamfight comp sans protection du carry',         axis:'pr'});
  if (scores.sp > 4 && scores.tf < 2)   g.push({msg:'Full split — dangereux si teamfight forcé',       axis:'tf'});
  if (scores.pk > 4 && scores.e  < 2)   g.push({msg:'Pick comp sans engage dur (fragile)',             axis:'e'});
  if (scores.po < 2 && scores.pr < 2 && scores.e < 2) g.push({msg:'Peu de pression à distance ou d\'initiation', axis:'po'});
  return g;
}

  renderBars('barsRed',  rScores);

  // Synergies
  renderSynergies('synBlue', s.bluePicks);
  renderSynergies('synRed',  s.redPicks);

  // Timing
  renderTiming('timingBlue', compTiming(bScores, s.bluePicks));
  renderTiming('timingRed',  compTiming(rScores, s.redPicks));

  // Archétype + win condition
  document.getElementById('nameBlue').textContent   = compArchetype(bScores, s.bluePicks);
  document.getElementById('nameRed').textContent    = compArchetype(rScores, s.redPicks);
  document.getElementById('wincondBlue').textContent = winCondition(bScores, s.bluePicks);
  document.getElementById('wincondRed').textContent  = winCondition(rScores, s.redPicks);

  // PlaZma keys
  const pzKey    = s.plazmaside === 'blue' ? 'bluePicks'  : 'redPicks';
  const oppKey   = s.plazmaside === 'blue' ? 'redPicks'   : 'bluePicks';
  const pzScores = s.plazmaside === 'blue' ? bScores      : rScores;
  const oppScores= s.plazmaside === 'blue' ? rScores      : bScores;

  // Analyse croisée
  const { threats, adv } = crossAnalysis(pzScores, oppScores, s[pzKey], s[oppKey]);
  const crossSec = document.getElementById('crossSection');
  if (threats.length || adv.length) {
    crossSec.style.display = '';
    let html = '';
    if (threats.length) {
      html += `<div class="cross-sep">Vigilance</div>`;
      html += threats.map(t=>`<div class="threat-line">${esc(t)}</div>`).join('');
    }
    if (adv.length) {
      html += `<div class="cross-sep" style="color:var(--ok)">Vos atouts</div>`;
      html += adv.map(a=>`<div class="adv-line">${esc(a)}</div>`).join('');
    }
    document.getElementById('crossContent').innerHTML = html;
  } else {
    crossSec.style.display = 'none';
  }

  // Gaps PlaZma avec suggestions pool
  const gaps = compGaps(s[pzKey], pzScores);
  const gapSec = document.getElementById('gapsSection');
  if (gaps.length) {
    gapSec.style.display = '';
    document.getElementById('gapsList').innerHTML = gaps.map(g => {
      const sugg = gapSuggestions(g.axis, s[pzKey]);
      let html = `<div class="gap-line">${esc(g.msg)}`;
      if (sugg.length && C()) {
        const names = sugg.map(id => C().nameOf(id)).join(', ');
        html += `<div style="font-size:10px;color:var(--muted);margin-top:2px;padding-left:0">Pool: ${esc(names)}</div>`;
      }
      return html + '</div>';
    }).join('');
  } else {
    gapSec.style.display = 'none';
  }

  renderPool();
}

function renderPool() {
  const s = scn();
  const poolSec = document.getElementById('poolSection');
  if (step >= SEQ.length) { poolSec.style.display = 'none'; return; }
  const cur = SEQ[step];
  if (cur.type !== 'pick' || cur.team !== s.plazmaside) { poolSec.style.display = 'none'; return; }
  const role = ROLES[cur.ri];
  const pool = teamPools[role.key] || [];
  if (!pool.length) { poolSec.style.display = 'none'; return; }
  poolSec.style.display = '';
  const player = PZ.getRoster().find(p => p.roleKey === role.key);
  document.getElementById('poolTitle').textContent = `Pool ${player ? player.name : role.label}`;

  // Fit scoring
  const pzKey    = s.plazmaside === 'blue' ? 'bluePicks' : 'redPicks';
  const pzScores = compScores(s[pzKey]);
  const needs    = compNeeds(pzScores);
  const used     = allUsed(s);

  const scored = pool.map(id => ({ id, score: fitScore(id, needs), used: used.includes(id) }))
    .sort((a,b) => a.used - b.used || b.score - a.score);
  const maxFit = scored.reduce((m,x)=>!x.used?Math.max(m,x.score):m, 0);

  document.getElementById('poolGrid').innerHTML = scored.map(({id, score, used:isUsed}) => {
    const u    = C() ? C().iconUrl(id)  : '';
    const nm   = C() ? C().nameOf(id)   : id;
    const fitH = !isUsed && maxFit > 0 && score >= maxFit * .7;
    const fitM = !isUsed && maxFit > 0 && score >= maxFit * .35 && !fitH;
    const cls  = `pool-chip${isUsed?' used':''}${fitH?' fit-high':''}${fitM?' fit-med':''}`;
    return `<div class="${cls}" title="${esc(nm)}${!isUsed&&fitH?' ★ Recommandé':''}">
      ${u ? `<img src="${u}" alt="">` : ''}
      ${fitH ? `<span class="fit-dot" style="background:#4ade80"></span>` : ''}
      ${fitM ? `<span class="fit-dot" style="background:#fbbf24"></span>` : ''}
    </div>`;
  }).join('');
}

// ── Scenario tabs ──
function renderScnTabs() {
  const bar = document.getElementById('scnTabs');
  bar.innerHTML = scenarios.map((s, i) =>
    `<button class="scn-tab${i===curScn?' active':''}" data-i="${i}">${esc(s.name||'Draft '+(i+1))}</button>`
  ).join('')
    + `<button class="btn btn-sm" id="scnNew" data-edit>＋</button>`
    + `<button class="btn btn-sm" id="scnDup" data-edit>Dupliquer</button>`
    + `<button class="btn btn-sm btn-danger" id="scnDel" data-edit>Supprimer</button>`;
  bar.querySelectorAll('.scn-tab').forEach(t => t.addEventListener('click', () => {
    curScn = +t.dataset.i; step = 0; renderAll();
  }));
  document.getElementById('scnNew').addEventListener('click', () => {
    scenarios.push(emptyScenario()); curScn = scenarios.length - 1; step = 0; renderAll(); queueSave();
  });
  document.getElementById('scnDup').addEventListener('click', () => {
    const c = JSON.parse(JSON.stringify(scn())); c.id = emptyScenario().id; c.name = (c.name||'Draft') + ' (copie)';
    scenarios.push(c); curScn = scenarios.length - 1; step = 0; renderAll(); queueSave();
  });
  document.getElementById('scnDel').addEventListener('click', () => {
    if (scenarios.length <= 1 || !confirm('Supprimer ce scénario ?')) return;
    scenarios.splice(curScn, 1); curScn = Math.max(0, curScn - 1); step = 0; renderAll(); queueSave();
  });
}

// ── Inputs equipe ──
document.getElementById('blueInp').addEventListener('input', e => { scn().blueTeam = e.target.value; queueSave(); });
document.getElementById('redInp').addEventListener('input', e => { scn().redTeam  = e.target.value; queueSave(); });

function setPlazmaside(side) { scn().plazmaside = side; renderAll(); queueSave(); }

// ── Firestore (multi-docs, même pattern que scrim/scouting) ──
const newDocId = () => 'draft-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6);
let lastSig = null, suppressUntil = 0;
const sig = o => { const c = JSON.parse(JSON.stringify(o||{})); delete c._savedAt; return JSON.stringify(c); };

function save() {
  if (!db || !currentDocId) return;
  PZ.status('syncing', 'Sauvegarde…');
  const state = JSON.parse(JSON.stringify({ scenarios }));
  lastSig = sig(state); suppressUntil = Date.now() + 2000;
  state._savedAt = firebase.firestore.FieldValue.serverTimestamp();
  db.collection(DRAFT_COL).doc(currentDocId).set(state)
    .then(() => PZ.status('connected', 'Synchronisé', PZ.nowTime()))
    .catch(e => { console.error(e); PZ.status('error', 'Erreur Firebase'); });
}

function startSync(docId) {
  if (!db) { PZ.status('error', 'Firebase indisponible'); PZ.loadingDone(); return; }
  if (_unsub) { _unsub(); _unsub = null; }
  currentDocId = docId; lastSig = null; suppressUntil = 0;
  PZ.status('syncing', 'Connexion…');
  _unsub = db.collection(DRAFT_COL).doc(docId).onSnapshot(doc => {
    if (doc.metadata.hasPendingWrites) return;
    if (!doc.exists) { PZ.status('connected', 'Nouvelle draft', ''); PZ.loadingDone(); return; }
    const incoming = sig(doc.data());
    if (incoming === sig({ scenarios }) || incoming === lastSig || Date.now() < suppressUntil) {
      PZ.status('connected', 'Synchronisé', PZ.nowTime()); PZ.loadingDone(); return;
    }
    const d = doc.data();
    scenarios = (Array.isArray(d.scenarios) && d.scenarios.length)
      ? d.scenarios.map(s => Object.assign(emptyScenario(), s))
      : [emptyScenario()];
    curScn = 0; step = 0; renderAll();
    PZ.status('connected', 'Synchronisé', PZ.nowTime()); PZ.loadingDone();
  }, err => { console.error(err); PZ.status('error', 'Erreur connexion'); PZ.loadingDone(); });
}

function newDraft() {
  if (!confirm('Créer une nouvelle draft ? L\'actuelle reste sauvegardée.')) return;
  scenarios = [emptyScenario()]; curScn = 0; step = 0; renderAll(); startSync(newDocId());
}
function resetDraft() {
  if (!confirm('Vider la draft actuelle ?')) return;
  scenarios = [emptyScenario()]; curScn = 0; step = 0; renderAll(); save();
}
function loadDraft(id) { if (id === currentDocId) { closeDrawer(); return; } startSync(id); closeDrawer(); }
async function deleteDraft(id, e) {
  e.stopPropagation();
  if (!confirm('Supprimer définitivement cette draft ?')) return;
  await db.collection(DRAFT_COL).doc(id).delete();
  if (id === currentDocId) { scenarios = [emptyScenario()]; curScn = 0; step = 0; renderAll(); startSync(newDocId()); }
  loadDrawer();
}

// ── Drawer ──
function openDrawer() {
  document.getElementById('drawerOv').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  loadDrawer();
}
function closeDrawer() {
  document.getElementById('drawerOv').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}
async function loadDrawer() {
  const list = document.getElementById('drawerList');
  list.innerHTML = '<div class="drawer-empty">Chargement…</div>';
  if (!db) { list.innerHTML = '<div class="drawer-empty">Firebase indisponible.</div>'; return; }
  let docs = [];
  try {
    try { const snap = await db.collection(DRAFT_COL).orderBy('_savedAt','desc').get(); snap.forEach(d => docs.push({ id:d.id, ...d.data() })); }
    catch  { const snap = await db.collection(DRAFT_COL).get(); snap.forEach(d => docs.push({ id:d.id, ...d.data() })); }
  } catch(e) { list.innerHTML = '<div class="drawer-empty">Lecture impossible.</div>'; return; }
  document.getElementById('draftCount').textContent = docs.length ? '(' + docs.length + ')' : '';
  if (!docs.length) { list.innerHTML = '<div class="drawer-empty">Aucune draft sauvegardée.</div>'; return; }
  list.innerHTML = '';
  docs.forEach(doc => {
    const active = doc.id === currentDocId;
    const date = doc._savedAt?.toDate?.()?.toLocaleDateString('fr-FR', {day:'2-digit',month:'short',year:'numeric'}) || '';
    const first = (doc.scenarios && doc.scenarios[0]) || {};
    const nScn  = (doc.scenarios || []).length;
    const teams = [first.blueTeam, first.redTeam].filter(Boolean).join(' vs ');
    const el = document.createElement('div'); el.className = 'dr-card' + (active ? ' active-doc' : '');
    el.innerHTML = `<div class="dr-main">
      <div style="flex:1">
        <div style="font-family:var(--font-display);font-weight:600">${esc(first.name||'Draft')}</div>
        <div style="font-size:11px;color:var(--muted)">${date}${teams?' · '+esc(teams):''}${nScn>1?' · '+nScn+' scénarios':''}${active?' · en cours':''}</div>
      </div></div>
      <div class="dr-actions">
        <button onclick="loadDraft('${doc.id}')">${active?'Modifier':'Ouvrir'}</button>
        <button onclick="deleteDraft('${doc.id}',event)">Supprimer</button>
      </div>`;
    el.querySelector('.dr-main').addEventListener('click', () => loadDraft(doc.id));
    list.appendChild(el);
  });
}

// ── Import depuis Scouting ──
async function openScoutModal() {
  document.getElementById('scoutOverlay').classList.add('open');
  const sl = document.getElementById('scoutList');
  sl.innerHTML = '<p style="color:var(--muted);font-size:13px;text-align:center;padding:20px">Chargement…</p>';
  if (!db) { sl.innerHTML = '<p style="color:var(--muted);font-size:13px">Firebase indisponible.</p>'; return; }
  try {
    let docs = [];
    try { const snap = await db.collection(SCOUT_COL).orderBy('_savedAt','desc').get(); snap.forEach(d => docs.push({ id:d.id, ...d.data() })); }
    catch  { const snap = await db.collection(SCOUT_COL).get(); snap.forEach(d => docs.push({ id:d.id, ...d.data() })); }
    if (!docs.length) { sl.innerHTML = '<p style="color:var(--muted);font-size:13px">Aucune fiche scouting trouvée.</p>'; return; }
    sl.innerHTML = '';
    docs.forEach(doc => {
      const date = doc._savedAt?.toDate?.()?.toLocaleDateString('fr-FR', {day:'2-digit',month:'short',year:'numeric'}) || '';
      const el = document.createElement('div'); el.className = 'scout-item';
      el.innerHTML = `<div style="flex:1"><div style="font-weight:600">${esc(doc.m_team||'Sans nom')}</div>
        <div style="font-size:11px;color:var(--muted)">${date}${doc.m_tournoi?' · '+esc(doc.m_tournoi):''}</div></div>
        <button class="btn btn-sm btn-primary">Importer</button>`;
      el.querySelector('button').addEventListener('click', () => {
        const s = scn();
        const opponent = doc.m_team || 'Adversaire';
        if (s.plazmaside === 'blue') s.redTeam  = opponent;
        else                         s.blueTeam = opponent;
        s.name = 'Draft vs ' + opponent;
        renderAll(); queueSave(); closeScoutModal();
      });
      sl.appendChild(el);
    });
  } catch(e) { sl.innerHTML = '<p style="color:var(--muted);font-size:13px">Erreur de lecture.</p>'; }
}
function closeScoutModal() { document.getElementById('scoutOverlay').classList.remove('open'); }

// ── Init ──
renderAll();
window.Champions.ready.then(() => renderAll());
(async () => {
  if (!db) { PZ.status('error', 'Firebase indisponible'); PZ.loadingDone(); return; }
  try {
    const snap = await db.collection(DRAFT_COL).orderBy('_savedAt','desc').limit(1).get();
    startSync(snap.empty ? newDocId() : snap.docs[0].id);
    const all = await db.collection(DRAFT_COL).get();
    document.getElementById('draftCount').textContent = all.size ? '(' + all.size + ')' : '';
  } catch { startSync(newDocId()); }
})();
</script>
